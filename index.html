const workTemplates={
 installation:{title:'Commercial Solar PV Installation RAMS',scope:'Commercial solar PV installation works, including site preparation, safe access, PV installation activities, AC/DC connections, protective earthing/bonding, inspection, testing and commissioning. Confirm the exact installation scope against the approved design, drawings, manufacturer instructions and site requirements before work starts.',activities:'Pre-start briefing and review of RAMS, approved design, drawings and site conditions. Establish safe access and egress, work areas, storage and exclusion zones. Inspect PPE, plant and equipment. Complete relevant permits/authorisations. Confirm PV equipment, cable routes and electrical isolation points. Carry out the approved installation sequence with appropriate working-at-height controls. Complete AC/DC connections, protective earthing/bonding and associated cable management as applicable. Inspect, test and commission the completed installation, record results and carry out controlled energisation in accordance with the approved procedure.',plant:'110V or battery-powered tools; suitable calibrated electrical test and inspection equipment; MEWP/access equipment where specified; compatible fall-protection equipment where required; suitable manual-handling/mechanical lifting equipment. Any specialist lifting operation must be separately planned and controlled by the competent lifting contractor.',materials:'PV modules and associated components; mounting system/rails and fixings; AC/DC cables and connectors; inverters where included in the scope; protective earthing/bonding materials; cable containment/supports; glands, bushes/grommets and fixings; labels/signage; manufacturer-specified components.',workers:'',method:'1. Pre-start: review the approved design, drawings, RAMS, manufacturer instructions and site requirements. Confirm access, weather, permits, rescue arrangements and calibrated test equipment.\n\n2. Site set-up: establish the agreed work area, signage, storage and exclusion zones. Keep access and escape routes clear. Inspect PPE, plant and equipment and complete required briefings/toolbox talks.\n\n3. Roof access and working at height: use designated access routes and installed fall-protection arrangements where required. Inspect ManSafe/anchor systems, harnesses and connectors before use. Remain within system parameters and maintain continuous attachment where required. Do not attach to PV panels, rails, roof sheets or other non-approved points.\n\n4. Installation: install equipment and components in accordance with the approved design and manufacturer instructions. Maintain safe handling practices and protect cables and components from mechanical damage.\n\n5. Electrical connections: positively identify the relevant PV strings and AC circuits. Follow the approved safe isolation procedure where circuits are to be worked on. Treat PV DC circuits as potentially live until appropriately isolated and tested. Complete connections, protective earth/bonding and cable management as applicable.\n\n6. Inspection, testing and commissioning: visually inspect completed work, connections, fixings and cable routes. Complete required AC/DC testing using suitable calibrated equipment and record results. Investigate unexpected results before energisation.\n\n7. Completion: confirm the area is safe, remove tools and waste, restore guards/covers and complete permits. Carry out controlled energisation/return to service in accordance with the approved procedure.\n\nIf the work activity, site conditions or planned sequence changes, stop work and consult the supervisor before continuing; amend/reissue the safe system where required.',type:'installation'},
 inverter:{title:'Commercial Solar PV Inverter Replacement RAMS',scope:'Planned replacement of existing solar PV inverters, including safe shutdown, AC/DC isolation, removal and installation, cable/connection inspection, protective earth/bonding, testing, commissioning and controlled return to service. The uploaded source describes replacement of large ABB inverters as individual work packages; confirm the actual inverter model, quantity and project scope before use.',activities:'Pre-start briefing and review of RAMS, drawings and site conditions. Confirm the correct inverter and electrical specification. Identify PV strings, AC circuits and isolation points. Establish access and fall-protection controls. Isolate and prove dead before electrical work. Remove the existing inverter, inspect the mounting arrangement and cable routes, install the replacement, reconnect AC/DC/protective earth/bonding and communications as applicable, test and commission, then re-energise under the approved procedure.',plant:'110V or battery-powered tools; suitable calibrated electrical test equipment; MEWP/access equipment where specified; ManSafe/fall-protection equipment where required; suitable manual-handling/mechanical lifting equipment. Specialist crane lifting, where required, to be controlled by the lifting contractor under the agreed lift plan/contract-lift arrangements.',materials:'Replacement inverter; mounting components; AC/DC cables/connectors as required; protective earth/bonding materials; glands/strain relief; cable containment and supports where required; labels; manufacturer-specified components and fixings.',workers:'',method:'1. Pre-start: confirm the correct inverter, model and electrical specification. Make the manufacturer instructions, electrical schematic/single-line diagram and relevant drawings available. Confirm the PV string and AC circuits, isolation points, access controls, rescue arrangements and calibrated test equipment.\n\n2. Safe access: use designated roof/access routes and the installed fall-protection system where required. Complete pre-use checks of ManSafe/anchors, harnesses, connectors and associated equipment.\n\n3. Isolation: positively identify the relevant PV inverter circuit. Isolate the AC and DC sides as applicable, secure against re-energisation using the approved procedure and verify isolation/prove dead with suitable test equipment. Treat PV DC circuits as potentially live until appropriately isolated and tested.\n\n4. Removal: inspect the existing mounting arrangement, cable routes and connections. Disconnect and remove the existing inverter without damaging cables, connectors or equipment.\n\n5. Installation: install the replacement inverter onto the approved mounting arrangement. Reconnect DC, AC, protective earth/bonding and communications connections as applicable. Check polarity, connector compatibility, cable routing, strain relief, protective devices, earthing/bonding and cable identification. Tighten terminations to manufacturer-specified torque where applicable.\n\n6. Testing and commissioning: visually inspect the completed installation. Complete required AC testing and DC PV testing using suitable calibrated equipment. Record and review results and investigate unexpected results before proceeding.\n\n7. Re-energisation: confirm the work area is safe, restore covers/guards, clear tools and materials and deal with permits. Carry out controlled re-energisation and return the inverter to service in accordance with the approved procedure. Treat each inverter as an individual work package where multiple units are involved.',type:'inverter'},
 remedial:{title:'Commercial Solar PV Remedial Works RAMS',scope:'Commercial solar PV remedial works including inspection, repair or replacement of PV electrical equipment and components, inverter works where applicable, cable containment remedial works, AC/DC connections, testing, commissioning and controlled return to service. Confirm the exact remedial scope against the project documentation and site requirements.',activities:'Pre-start briefing and review of RAMS, drawings and site conditions. Establish safe access, work areas, storage and exclusion zones. Inspect PPE, plant and equipment. Identify affected equipment, PV strings, AC circuits and isolation points. Complete safe isolation and verification before electrical work. Carry out the planned remedial works, including inverter or cable-containment work where applicable. Inspect, test and commission completed work, record results and carry out controlled re-energisation.',plant:'110V or battery-powered tools; suitable calibrated electrical test and inspection equipment; MEWP/access equipment where specified; compatible fall-protection equipment; suitable manual-handling/mechanical lifting equipment. Specialist crane lifting, where required, to be controlled by the lifting contractor under a separate lift plan/contract-lift arrangement.',materials:'Approved replacement PV components; inverters and mounting components where applicable; AC/DC cables and connectors; protective earthing/bonding materials; cable containment, supports, glands, bushes/grommets and fixings; labels/signage; manufacturer-specified materials.',workers:'',method:'1. Pre-start: review the approved RAMS, drawings, electrical schematics and manufacturer instructions. Confirm the correct equipment, isolation points, access arrangements, weather, permits, rescue arrangements and calibrated test equipment.\n\n2. Site set-up: establish the agreed work area, signage, storage and exclusion zones. Keep access and escape routes clear. Inspect PPE, plant and equipment and complete required briefings/toolbox talks.\n\n3. Roof access: use designated access routes and appropriate fall-protection arrangements where required. Inspect ManSafe/anchors, harnesses, connectors and associated equipment before use. Maintain continuous attachment where required and remain within system parameters.\n\n4. Electrical isolation: positively identify the affected PV strings and AC circuits. Isolate the relevant AC/DC sources using the approved safe isolation procedure, secure against re-energisation and verify isolation/prove dead. Treat PV DC circuits as potentially live until appropriately isolated and tested.\n\n5. Remedial works: inspect affected equipment, mounting arrangements, cable routes and connections. Complete approved repairs/replacements in accordance with the design and manufacturer instructions. Where cable containment is defective, support cables during removal and install suitable secure containment with appropriate edge protection, bend radii and separation.\n\n6. Connections and earthing: verify polarity, compatible connectors, cable routing, strain relief, protective devices, protective conductor, earthing/bonding and cable identification as applicable.\n\n7. Testing: visually inspect completed works and fixings. Complete required AC/DC testing using suitable calibrated equipment, record results and investigate unexpected results before return to service.\n\n8. Completion: make the area safe, remove tools/waste, restore guards/covers and close applicable permits. Carry out controlled re-energisation and record defects or outstanding actions.\n\nIf the work activity, site conditions or planned sequence changes, stop work and consult the supervisor before continuing; amend/reissue the safe system where required.',type:'remedial'},
 containment:{title:'Commercial Solar PV Cable Containment Works RAMS',scope:'Solar PV cable containment inspection, remedial and replacement works for AC, DC, earthing and associated control/communication cables. Works include identification and assessment, safe isolation where required, removal of defective containment, installation of suitable replacement containment, cable management, inspection and any required electrical testing.',activities:'Pre-start briefing and review of RAMS, drawings and site conditions. Establish safe access and work areas. Identify affected containment and assess cable condition. Isolate relevant circuits before moving or disturbing electrical cables. Carefully remove defective containment while supporting cables. Install suitable replacement containment, supports and edge protection. Maintain cable bend radii, separation and identification. Inspect the completed installation and complete any required electrical testing before return to service.',plant:'110V or battery-powered tools; suitable calibrated electrical test equipment; access equipment/MEWP where specified; compatible fall-protection equipment; suitable manual-handling equipment; suitable cable/containment installation tools.',materials:'Replacement cable containment; supports and fixings suitable for the building structure and load; edge protection, glands, bushes/grommets; AC/DC/earth/control cables or replacement components where approved; labels and waste-containment materials.',workers:'',method:'1. Pre-start: review the approved drawings, RAMS, cable routes and site requirements. Confirm access, weather, permits, isolation points and calibrated test equipment.\n\n2. Identify and assess: identify the affected containment and inspect it and the cables within it. Check for abrasion, crushing, excessive bending, unsupported cable weight, exposed sections and sharp edges. Stop and obtain competent assessment if cable damage is suspected.\n\n3. Electrical safety: where containment replacement requires access to or movement of electrical cables, isolate the relevant circuits in accordance with the approved procedure. Treat PV DC circuits as potentially energised due to generation from daylight until appropriately isolated and verified. Do not disturb cables unnecessarily.\n\n4. Remove defective containment: dismantle carefully. Support cables so their weight is not transferred to connectors, terminals or equipment. Protect insulation, glands and connectors. Transfer removed materials to the designated waste area.\n\n5. Install replacement containment: provide a continuous, secure and mechanically protective route. Use containment and supports suitable for the cable type, quantity, environment and building structure. Avoid sharp edges and provide suitable edge protection, glands, bushes or grommets at openings. Maintain manufacturer-required bend radii and required cable separation.\n\n6. Cable management: route cables neatly, support them at appropriate intervals and prevent cables hanging from terminals or connectors. Do not over-compress or exceed containment capacity. Retain or replace cable identification where disturbed and minimise mechanical damage/contact with the roof or building structure.\n\n7. Inspection and testing: visually inspect the completed containment, fixings, cable routes and entry/exit points. Complete any electrical testing required by the works using suitable calibrated equipment before return to service.\n\n8. Completion: remove waste, maintain clear access/escape routes, close applicable permits and report defects or outstanding actions.',type:'containment'}
};

Object.assign(workTemplates,{general:{title:'General Commercial Electrical Works RAMS',scope:'Commercial electrical installation, alteration, repair or maintenance works. Confirm the exact circuit, equipment, voltage, access arrangements, isolation requirements, permits and client/site controls before work starts.',activities:'Pre-start briefing; review drawings and RAMS; establish safe access and work area; identify supplies and isolation points; complete safe isolation where required; carry out installation, alteration, repair or maintenance by competent persons; inspect, test and commission; controlled re-energisation and handover.',plant:'Suitable calibrated electrical test equipment; 110V or battery tools where practicable; hand tools; access equipment/MEWP where required; cable and containment tools; suitable lifting/handling aids.',materials:'Approved electrical equipment, cables, containment, accessories, fixings, labels, glands and manufacturer-specified components as applicable.',workers:'',method:'1. Review the approved design, drawings, RAMS, manufacturer instructions and site requirements. Confirm the exact scope and identify all electrical sources.\n\n2. Establish the work area, access/egress, exclusion zones, storage and signage. Inspect tools, plant, PPE and test equipment.\n\n3. Identify the circuit/equipment and isolation points. Follow the approved safe-isolation procedure, isolate all relevant sources, secure against re-energisation and prove dead before work where required.\n\n4. Carry out the electrical installation, alteration, repair or maintenance in accordance with the approved design and manufacturer instructions.\n\n5. Maintain good cable management, secure equipment and protect persons from exposed electrical parts.\n\n6. Inspect and test the completed work using suitable calibrated equipment. Record results and investigate unexpected results before energisation.\n\n7. Confirm the work area is safe, restore covers/guards, remove tools and waste, close applicable permits and carry out controlled re-energisation and handover.\n\nIf the scope, site conditions or planned sequence changes, stop work and consult the supervisor before continuing.',type:'general'},distribution:{title:'LV Distribution / Switchgear / DB Works RAMS',scope:'Installation, alteration, replacement, inspection or maintenance of LV distribution equipment including switchgear, distribution boards, consumer units and associated protective devices. Confirm the actual voltage, fault level, equipment ratings and isolation arrangements for the project.',activities:'Review design and schedules; identify supplies and possible backfeeds; establish safe working area; isolate and prove dead; remove/install distribution equipment; terminate and torque conductors; verify protective devices, earthing and bonding; inspect and test; controlled energisation.',plant:'Calibrated multifunction tester and approved electrical test equipment; torque tools; insulated hand tools; battery/110V tools; lifting/handling aids; access equipment where required.',materials:'Distribution boards/switchgear; protective devices; busbar and neutral components; cables and glands; labels; earthing/bonding conductors; fixings and manufacturer-approved accessories.',workers:'',method:'1. Review approved drawings, schedules, equipment ratings and manufacturer instructions. Identify all normal and alternative supplies.\n\n2. Establish the exclusion zone and signage. Confirm permits and safe access.\n\n3. Complete safe isolation of all relevant sources and verify dead using an approved procedure and suitable test equipment.\n\n4. Remove/install equipment using suitable handling methods. Protect adjacent live equipment and maintain required clearances.\n\n5. Terminate conductors correctly, including neutral, protective conductors and bonding. Apply manufacturer-specified torque where applicable.\n\n6. Inspect labels, protective devices, covers, connections, earthing/bonding and enclosure condition. Complete required testing and record results.\n\n7. Reassemble, clear the area and controlled-energise in accordance with the approved procedure. Investigate any abnormal condition before return to service.',type:'distribution'},cable:{title:'Electrical Cable Installation / Termination RAMS',scope:'Installation, routing, dressing, glanding and termination of electrical cables for LV commercial installations. Confirm cable type, size, route, containment, segregation, support, fire stopping and termination requirements from the approved design.',activities:'Review cable schedule and route; inspect containment; establish safe access; install cables using suitable handling methods; maintain bend radii and segregation; gland and terminate; label and support cables; inspect, test and document.',plant:'Cable rollers and handling equipment; calibrated electrical test equipment; cable preparation and crimping tools; torque tools; battery/110V tools; access equipment where required.',materials:'Approved cables; glands; lugs/ferrules; cleats/ties; containment accessories; labels; fire-stopping materials where specified; fixings and termination accessories.',workers:'',method:'1. Review drawings, cable schedules, manufacturer requirements and route information.\n\n2. Inspect containment and access routes. Confirm the route is suitable, clear and safe before cable installation.\n\n3. Plan cable handling, drum movement and pulling operations. Use suitable rollers/handling aids and team lifting where required.\n\n4. Install cables without exceeding manufacturer pulling limits, bend radii or support requirements. Maintain required segregation and protect against sharp edges or mechanical damage.\n\n5. Gland and terminate cables using approved components. Check conductor identification, polarity/phase arrangement, protective conductors and termination torque where specified.\n\n6. Inspect cable routes, supports, glands, terminations, labels and fire stopping. Complete required testing and record results.\n\n7. Make the installation safe, remove waste and complete handover documentation.',type:'cable'},containmentElec:{title:'Electrical Containment - Tray / Trunking / Conduit RAMS',scope:'Installation or alteration of electrical cable containment including tray, trunking, conduit and associated supports and accessories.',activities:'Review drawings and service information; set out routes; identify hidden services; install supports and containment; maintain segregation and access; provide edge protection and bonding where required; inspect completed installation.',plant:'Battery/110V drills and tools; cable/containment tools; service detection equipment where required; access equipment/MEWP; calibrated test equipment for any required electrical verification.',materials:'Cable tray, trunking, conduit, supports, brackets, fixings, glands, bushes, couplers, earth/bonding accessories, labels and fire-stopping materials where specified.',workers:'',method:'1. Review approved drawings, containment routes and service information.\n\n2. Establish safe access and work areas. Before drilling or cutting, check for concealed services and confirm the proposed fixing locations are suitable.\n\n3. Install supports and containment to the approved design. Maintain appropriate spacing, loading, clearances and access to electrical equipment.\n\n4. Remove sharp edges and provide suitable bushes/grommets. Maintain required segregation and provide bonding/earth continuity where applicable.\n\n5. Inspect fixings, joints, supports and route condition. Confirm containment does not obstruct equipment operation or escape routes.\n\n6. Complete any required electrical verification and record defects/actions.\n\n7. Clear waste and leave the area safe and accessible.',type:'containmentElec'},lighting:{title:'Commercial Lighting Installation / Alteration RAMS',scope:'Installation, alteration, replacement or maintenance of commercial lighting and associated switching/control circuits.',activities:'Review lighting layout and circuit schedules; establish safe access; isolate relevant circuits; install/replace luminaires and controls; maintain cable protection and support; inspect and test; restore service.',plant:'MEWP or suitable access equipment; battery/110V tools; insulated hand tools; calibrated electrical test equipment; suitable lifting aids.',materials:'Luminaires; lamps/modules; cables; containment accessories; switches/sensors; fixings; glands; labels and manufacturer-approved components.',workers:'',method:'1. Review lighting drawings, circuit schedules and manufacturer instructions.\n\n2. Establish an exclusion zone and safe access method. Inspect access equipment before use.\n\n3. Identify and safely isolate the relevant circuits before electrical work. Prove dead as required.\n\n4. Remove existing equipment safely and install the replacement/altered lighting equipment in accordance with the design and manufacturer instructions.\n\n5. Check terminations, protective conductors, mechanical fixing and cable support.\n\n6. Complete required electrical tests and functional checks.\n\n7. Restore covers, remove equipment/waste and controlled-energise the circuit. Confirm lighting operation with the site representative.',type:'lighting'},emergency:{title:'Emergency Lighting Works RAMS',scope:'Installation, replacement, inspection, testing or maintenance of emergency lighting systems and associated circuits.',activities:'Review emergency lighting design and test requirements; establish safe access; isolate where required; install/replace fittings and controls; complete functional and duration tests as applicable; record results and defects.',plant:'Access equipment/MEWP where required; battery/110V tools; calibrated electrical test equipment; suitable test facilities and manufacturer-specific equipment.',materials:'Emergency luminaires; batteries/modules; test switches/keys; cables and accessories; labels; fixings and manufacturer-approved components.',workers:'',method:'1. Review the emergency lighting layout, circuit identification, test requirements and manufacturer instructions.\n\n2. Establish safe access and exclusion zones.\n\n3. Isolate relevant circuits where required and verify safe before electrical work.\n\n4. Install or replace emergency lighting equipment and associated components. Maintain correct circuit identification and protective conductors.\n\n5. Complete required functional and duration testing in accordance with the system requirements and project specification.\n\n6. Record results, defects and remedial actions.\n\n7. Restore the system to the required normal/maintained condition and hand over documentation.',type:'emergency'},smallpower:{title:'Small Power / Sockets / Final Circuits RAMS',scope:'Installation, alteration, replacement or maintenance of commercial small-power outlets and final circuits.',activities:'Review circuit schedules; identify isolation points; install containment and cables; fit accessories; terminate; test polarity, continuity, insulation and protective measures as applicable; functional check and handover.',plant:'Calibrated multifunction tester; socket testers where appropriate; insulated hand tools; battery/110V tools; access equipment where required.',materials:'Socket outlets and accessories; cables; back boxes; containment; glands; labels; fixings and manufacturer-approved components.',workers:'',method:'1. Review drawings, circuit schedules and accessory specifications.\n\n2. Establish safe access and identify the correct circuit and isolation point.\n\n3. Isolate and prove dead before working on existing circuits where required.\n\n4. Install cables, containment and accessories in accordance with the approved design.\n\n5. Check terminations, polarity, protective conductors and mechanical security.\n\n6. Complete required inspection and testing and record results.\n\n7. Restore covers, remove waste and controlled-energise. Complete functional checks and handover.',type:'smallpower'},testing:{title:'Electrical Inspection, Testing & Commissioning RAMS',scope:'Electrical inspection, testing, verification and commissioning of commercial LV installations and equipment. The exact test sequence and extent shall follow the approved design, applicable requirements, manufacturer instructions and client specification.',activities:'Review test requirements; identify circuits and isolation boundaries; establish safe test area; carry out visual inspection and dead tests; carry out live tests only where necessary and appropriately controlled; record results; investigate unexpected results; commission and hand over.',plant:'Suitable calibrated multifunction installation tester; insulation resistance tester; loop/continuity equipment; proving unit; voltage indicator; approved test leads and accessories; other manufacturer-specified test equipment.',materials:'Test labels; circuit schedules; commissioning sheets; warning signage; approved temporary barriers and documentation.',workers:'',method:'1. Review the approved design, test schedule, manufacturer instructions and previous records. Confirm equipment calibration is current.\n\n2. Identify circuits, test boundaries and sources. Establish barriers/signage and prevent unauthorised access.\n\n3. Carry out visual inspection and appropriate dead testing first.\n\n4. Where live testing is required, ensure the risk is assessed, the area is controlled and the correct PPE and test equipment are used.\n\n5. Record all results accurately and compare them with design/manufacturer requirements.\n\n6. Stop and investigate unexpected results, abnormal readings or damaged equipment before proceeding.\n\n7. Complete commissioning, labels, certificates and handover records. Remove temporary controls only when the system is safe and complete.',type:'testing'},shutdown:{title:'Electrical Shutdown / Safe Isolation RAMS',scope:'Planned electrical shutdowns, isolation, connection, alteration or return-to-service activities on commercial LV systems. Exact switching arrangements must be agreed with the responsible person/DNO/client where applicable.',activities:'Agree shutdown scope and switching schedule; identify all sources; establish permits and communications; isolate and secure; prove dead; complete works; inspect/test; remove tools and personnel; controlled restoration and confirmation of supply.',plant:'Approved voltage indicator and proving unit; suitable calibrated test equipment; insulated tools; approved barriers/signage; isolation devices and tags as required by the site procedure; communication equipment.',materials:'Labels/signage; isolation documentation; permits; barriers; approved connection accessories and consumables.',workers:'',method:'1. Agree the shutdown scope, switching sequence, affected equipment and responsible persons before work begins.\n\n2. Review drawings and identify all normal and alternative sources, including backfeeds.\n\n3. Establish the exclusion zone, permits and communications.\n\n4. Carry out the approved safe-isolation procedure. Isolate, secure against re-energisation and prove dead using an approved test process.\n\n5. Complete the authorised works while maintaining the isolation boundary and communication with the responsible person.\n\n6. Inspect and test the completed works. Confirm all tools, temporary earths where applicable, covers and personnel are clear before restoration.\n\n7. Follow the agreed switching schedule to re-energise. Confirm normal operation and close/return permits as required.',type:'shutdown'},faultfinding:{title:'Electrical Fault Finding / Repairs RAMS',scope:'Commercial electrical fault finding, diagnosis and repair. The fault-finding method shall be planned to minimise exposure to live parts and use live testing only where necessary and appropriately controlled.',activities:'Review reported fault; inspect installation; identify circuits and sources; isolate where possible; carry out diagnostic testing; repair defective components; inspect and test; controlled restoration and record findings.',plant:'Calibrated electrical test equipment; proving unit; voltage indicator; insulated hand tools; battery/110V tools; manufacturer-specific diagnostic equipment where required.',materials:'Approved replacement components, cables, accessories, labels and manufacturer-specified parts.',workers:'',method:'1. Review the fault report, drawings, previous records and equipment information.\n\n2. Establish the work area and identify the affected circuit and all possible supplies.\n\n3. Isolate where practicable before inspection or repair. If diagnostic live testing is genuinely required, ensure it is specifically assessed and controlled by a competent person using suitable equipment and PPE.\n\n4. Diagnose the fault methodically and record findings. Do not bypass protective devices or introduce uncontrolled temporary connections.\n\n5. Repair or replace defective components in accordance with the approved design and manufacturer instructions.\n\n6. Inspect and test the repair. Investigate abnormal results before restoration.\n\n7. Controlled-energise, function-test and record the completed repair and any outstanding recommendations.',type:'faultfinding'},controls:{title:'Control Panels / Motors / HVAC Electrical RAMS',scope:'Electrical installation, alteration, connection, testing or maintenance of control panels, motors, pumps, fans and HVAC-associated electrical systems.',activities:'Review schematics and control philosophy; identify supplies and control circuits; isolate; inspect equipment; install/terminate/control wiring; verify protective devices and earthing; test I/O and functional operation; commission.',plant:'Calibrated electrical test equipment; insulated hand tools; torque tools; battery/110V tools; access equipment where required; manufacturer-specific commissioning equipment.',materials:'Control panel components; contactors/relays; overloads; control cable; glands; terminals; labels; motors/fans/pumps as specified; manufacturer-approved components.',workers:'',method:'1. Review approved schematics, equipment schedules, control philosophy and manufacturer instructions.\n\n2. Identify power and control supplies and possible backfeeds. Establish safe access and isolation boundaries.\n\n3. Isolate relevant sources and prove dead before connection or maintenance work.\n\n4. Install or modify panel components, control wiring and field connections in accordance with the design.\n\n5. Verify protective devices, earthing/bonding, conductor identification, termination security and manufacturer torque requirements.\n\n6. Complete electrical testing and controlled functional testing of motors, fans, pumps or HVAC equipment.\n\n7. Commission, record settings/results and hand over with defects or outstanding actions clearly identified.',type:'controls'},firealarm:{title:'Fire Alarm / Life Safety Electrical Works RAMS',scope:'Installation, alteration, replacement, testing or maintenance of fire alarm and associated life-safety electrical systems. Any impairment of an operational system must be agreed with the responsible person and site fire procedures.',activities:'Review system design and zone/circuit information; establish access and impairment controls; isolate/disable only under authorised procedure; install/replace devices and cabling; test circuits/devices; restore system; record results and notify site representative.',plant:'Calibrated electrical test equipment; approved fire alarm test equipment; access equipment/MEWP where required; battery/110V tools; manufacturer programming equipment.',materials:'Fire alarm cable and containment; detectors; sounders; call points; modules; batteries; labels; fixings and manufacturer-approved components.',workers:'',method:'1. Review the approved fire alarm design, cause-and-effect information, device schedule and manufacturer instructions.\n\n2. Agree any system impairment with the responsible person/site management before disabling or isolating equipment. Implement required temporary fire precautions.\n\n3. Establish safe access and isolate relevant electrical supplies where required.\n\n4. Install/replace devices, cabling and associated components in accordance with the approved design.\n\n5. Test circuits, devices and system functions using approved test equipment.\n\n6. Restore the system fully, confirm normal status and remove temporary impairment controls only when authorised.\n\n7. Record test results, defects and any outstanding actions and inform the responsible person.',type:'firealarm'},ev:{title:'EV Charger Installation RAMS',scope:'Installation, connection, testing and commissioning of electric vehicle charging equipment and associated LV electrical infrastructure. Confirm the approved design, protective devices, earthing arrangement, load assessment and manufacturer requirements.',activities:'Review design and charger specification; establish safe access; identify supply and isolation; install containment and cable; install charger and protective equipment; terminate; test; configure; commission and hand over.',plant:'Calibrated electrical test equipment suitable for EV installations; cable preparation tools; torque tools; battery/110V tools; access equipment where required.',materials:'EV charger; approved cables; protective devices; isolation equipment; containment; glands; earthing/bonding components; labels and manufacturer-approved accessories.',workers:'',method:'1. Review the approved EV charging design, charger specification, circuit protection, earthing arrangement and load requirements.\n\n2. Establish the work area and identify the supply and isolation point. Check for hidden services before drilling.\n\n3. Install containment and cabling in accordance with the design, maintaining protection, support and required segregation.\n\n4. Mount the charger securely and complete AC/protective conductor/bonding connections as applicable.\n\n5. Complete inspection and testing using suitable calibrated equipment and the charger manufacturer commissioning procedure.\n\n6. Configure the charger as specified and complete functional tests.\n\n7. Record results, labels and commissioning information and hand over to the responsible person.',type:'ev'},earthing:{title:'Earthing / Bonding / Lightning Protection RAMS',scope:'Installation, alteration, inspection or testing of protective earthing, bonding and associated lightning-protection components.',activities:'Review earthing design; identify existing services; establish safe access; isolate where required; install conductors, clamps and connections; protect against mechanical damage; inspect continuity and connections; test and record.',plant:'Calibrated low-resistance/continuity test equipment; battery tools; hand tools; access equipment/MEWP; suitable torque tools.',materials:'Earth/bonding conductors; clamps; lugs; earth bars; fixings; labels; lightning protection components where specified; corrosion protection materials.',workers:'',method:'1. Review the approved earthing/bonding or lightning-protection design and identify existing connections that may be affected.\n\n2. Establish safe access and isolate electrical sources where required.\n\n3. Install conductors and connections using approved components. Ensure mechanical protection, correct routing and suitable fixing.\n\n4. Verify connection security, continuity and bonding arrangements. Apply manufacturer torque requirements where specified.\n\n5. Complete required inspection and testing and record results.\n\n6. Reinstate any disturbed connections and ensure the installation is left safe and accessible.',type:'earthing'},generator:{title:'Generator / UPS / Battery Systems RAMS',scope:'Installation, connection, testing, maintenance or replacement of generator, UPS and battery-backed electrical systems. Identify all normal, alternative and stored-energy sources before work starts.',activities:'Review system schematic; identify mains/generator/UPS/battery sources; establish isolation boundaries; isolate and verify; install/maintain equipment; reconnect; test controls and protection; controlled return to service.',plant:'Calibrated electrical test equipment; suitable battery/UPS test equipment; insulated tools; torque tools; lifting/handling equipment; access equipment where required.',materials:'Approved generator/UPS/battery components; cables; protective devices; battery connections; glands; labels; earthing/bonding materials and manufacturer-approved accessories.',workers:'',method:'1. Review approved schematics, manufacturer instructions and switching arrangements. Identify every normal, alternative and stored-energy source.\n\n2. Establish the work area and isolation boundaries. Confirm emergency arrangements for battery, generator and UPS equipment.\n\n3. Isolate mains, generator/UPS outputs and stored-energy sources as applicable. Verify safe condition before work.\n\n4. Complete installation, maintenance or replacement using suitable handling methods and manufacturer instructions.\n\n5. Verify protective devices, earthing/bonding, cable terminations and control connections.\n\n6. Complete inspection, electrical testing and controlled functional testing.\n\n7. Restore supplies in the agreed sequence, confirm normal/standby operation and record commissioning results.',type:'generator'}});

function standardsFor(type){let common="APPLICABLE LEGISLATION, REGULATIONS & STANDARDS\n- Electricity at Work Regulations 1989.\n- BS 7671:2018+A4:2026, IET Wiring Regulations, where applicable. During the transition period to 15 October 2026, BS 7671:2018+A3:2024 remains valid where applicable.\n- HSE HSG85 Electricity at Work: Safe Working Practices.\n- Construction (Design and Management) Regulations 2015, where applicable.\n- Provision and Use of Work Equipment Regulations 1998 (PUWER), where applicable.\n- Personal Protective Equipment at Work Regulations 1992 (as amended 2022), where applicable.\n- Manual Handling Operations Regulations 1992, where applicable.\n- Control of Substances Hazardous to Health Regulations 2002 (COSHH), where applicable.\n- Control of Noise at Work Regulations 2005 and Control of Vibration at Work Regulations 2005, where applicable.";let extra={"installation": "- BS EN 62446-1, photovoltaic (PV) systems documentation, commissioning tests and inspection, where applicable.\n- Relevant manufacturer installation and commissioning instructions.", "inverter": "- BS EN 62446-1, where applicable to PV inspection/testing and commissioning.\n- Relevant inverter manufacturer installation, testing and commissioning instructions.", "remedial": "- BS EN 62446-1, where applicable to PV inspection/testing and commissioning.\n- Relevant manufacturer instructions and approved design documentation.", "containment": "- BS 7671 requirements for selection and erection of wiring systems, segregation, protection and inspection/testing, where applicable.\n- Relevant manufacturer instructions for containment systems.", "distribution": "- BS 7671 requirements applicable to distribution circuits, switchgear, protection, isolation, earthing and verification.\n- BS EN 61439 series for relevant low-voltage assemblies, where applicable.", "cable": "- BS 7671 requirements applicable to wiring systems, cable selection, installation, termination, protection and verif function solarRamsTemplate(type='remedial'){let t={...(workTemplates[type]||workTemplates.remedial)};let standards=standardsFor(type);t.method=(t.method||'')+standards;return {...t,id:id(),project_id:'',project_name:'',site_address:'',client:'',main_contractor:'',project_number:'',start_date:'',review_date:'',prepared_by:'',version:'1.0',approval_status:'Draft',approved_by:'',approved_at:null,approval_notes:'',approval_signature:'',briefing_date:'',ppe:'Minimum site PPE as required by the site rules, with task-specific PPE identified by the RAMS. The source method statement specifies hard hat, safety footwear, safety glasses and hi-vis, with task-specific gloves. Hearing and respiratory protection are to be used where the site conditions and assessment require them. Where working at height is planned, use compatible full-body harness/fall-protection equipment in accordance with the site system and manufacturer instructions.',emergency:'A suitable site emergency procedure and work-at-height rescue plan must be established before work starts. Rescue arrangements must consider a fall and suspension in a harness, with suitable rescue equipment, access arrangements and competent personnel available. If a fall occurs, stop work, make the area safe and implement the emergency/rescue procedure. Fall-arrest equipment involved in a fall must be removed from service and quarantined pending competent inspection. For electrical incidents, stop work, keep persons clear, follow the approved site emergency procedure and contact site management/emergency services as appropriate. Permits must be closed/returned at the end of their validity where applicable.',environment:'Maintain good housekeeping throughout. Keep work areas and access/escape routes clear. Control noise and dust and minimise their generation. Dispose of waste appropriately; roof packaging/waste should be secured against wind and removed periodically. Prevent pollution and protect occupied/public areas. Review control async function saveRams(rid,statusOverride){let p=projects.find(a=>a.id===$('rp').value),ramId=rid||id(),risks=[...document.querySelectorAll('#riskList .riskRow')].map(c=>({hazard:c.querySelector('.rh')?.value.trim()||'',who:c.querySelector('.rw')?.value.trim()||'',likelihood:c.querySelector('.rl')?.value||'',severity:c.querySelector('.rs')?.value||'',controls:c.querySelector('.rc')?.value.trim()||'',res_likelihood:c.querySelector('.rrl')?.value||'',res_severity:c.querySelector('.rrs')?.value||''})).filter(a=>a.hazard||a.controls);let status=statusOverride||$('rstatus')?.value||'Draft',approver=$('rapprover')?.value.trim()||'',approvalSig=$('approvalsig')?.value||'',notes=$('rapprovalnotes')?.value.trim()||'';if(status==='Approved'&&(!approver||!approvalSig))return alert('To approve this RAMS, enter the approver name and add an approval signature.');if(status==='Rejected - Amendments Required'&&!notes)return alert('Please enter the amendments required before requesting changes.');let x={id:ramId,title:$('rt').value.trim(),project_id:$('rp').value||null,project_name:p?.name||'',site_address:$('rsa').value,client:$('rcl').value,main_contractor:$('rmc').value,project_number:$('rpn').value,start_date:$('rsd').value||null,review_date:$('rrd').value||null,prepared_by:$('rby').value,version:$('rv').value||'1.0',approval_status:status,approved_by:status==='Approved'?approver:'',approved_at:status==='Approved'?new Date().toISOString():null,approval_notes:notes,approval_signature:status==='Approved'?approvalSig:'',briefing_date:$('rbriefdate')?.value||null,scope:$('rsc').value,activities:$('rac').value,plant:$('rpl').value,materials:$('rma').value,workers:$('rwo').value,ppe:$('rpp').value,emergency:$('rem').value,environment:$('ren').value,competency:$('rec').value,method:$('rmet').value,risks,signoffs:collectSignoffs(),emergency_ae_address:$('rae')?.value||'',emergency_site_address:$('resa')?.value||$('rsa')?.value||'',emergency_site_contact:$('resc')?.value||'',emergency_fi async function printRams(rid,downloadPdf=false){
let x=rams.find(a=>a.id===rid);if(!x)return;
let routeUrl='';if(x.emergency_route_photo_path){let rq=await sb.storage.from('project-documents').createSignedUrl(x.emergency_route_photo_path,3600);if(!rq.error)routeUrl=rq.data.signedUrl;}
let risks=(x.risks||[]).map((r,i)=>{
 let il=(Number(r.likelihood)||0)*(Number(r.severity)||0), rl=(Number(r.res_likelihood)||0)*(Number(r.res_severity)||0);
 return `<tr><td>${i+1}</td><td><b>${esc(r.hazard)}</b><br>${esc(r.who)}</td><td class="score">${esc(r.likelihood)} × ${esc(r.severity)}<br><strong>${il||'—'}</strong><br>${riskClass(il)}</td><td>${esc(r.controls)}</td><td class="score">${esc(r.res_likelihood)} × ${esc(r.res_severity)}<br><strong>${rl||'—'}</strong><br>${riskClass(rl)}</td></tr>`;
}).join('');

xtarea id="drdelay" rows="4">${esc(x.delays||'')}</textarea></div></div><div class="grid"><div><label>Defects / snags</label><textarea id="drdefects" rows="4">${esc(x.defects||'')}</textarea></div><div><label>Additional works / variations</label><textarea id="dradd" rows="4">${esc(x.additional_works||'')}</textarea></div></div><label>Health &amp; safety / incidents / observations</label><textarea id="drsafe" rows="4" placeholder="Record incidents, near misses, unsafe conditions or state none">${esc(x.safety_issues||'')}</textarea><h3>Site photos</h3><p class="muted">Add photos of progress, defects, equipment or completed works. Photos are stored with the report.</p><input id="drphotos" type="file" accept="image/*" multiple><div id="drphotolist" class="muted">${Array.isArray(x.photos)&&x.photos.length?x.photos.map(ph=>`<div class="item">${esc(ph.name||'Photo')} <button type="button" class="secondary" onclick="viewDailyPhoto('${esc(ph.path)}')">View</button></div>`).join(''):'No photos uploaded.'}</div><h3>Sign-off</h3><div class="grid"><div><label>Engineer name</label><input id="drengname" value="${esc(x.engineer_name||'')}" placeholder="Name"><label>Engineer signature</label><canvas id="drsig" width="600" height="180" style="width:100%;height:140px;border:1px solid #d1d5db;border-radius:9px;background:#fff;touch-action:none"></canvas><input type="hidden" id="drsigval" value="${esc(x.engineer_signature||'')}"><button type="button" class="secondary" onclick="clearDailySignature('drsig','drsigval')">Clear signature</button></div><div><label>Client / site manager name</label><input id="drclient" value="${esc(x.client_name||'')}" placeholder="Optional"><label>Client / site manager signature</label><canvas id="drclientsig" width="600" height="180" style="width:100%;height:140px;border:1px solid #d1d5db;border-radius:9px;background:#fff;touch-action:none"></canvas><input type="hidden" id="drclientsigval" value="${esc(x.client_signature||'')}"><button type="button" class="secondary" onclick="clearDailySignature('drclientsig','drclientsigval')">Clear signature</button></div></div><div class="actions"><button class="primary" onclick="saveDailyReport('${x.id}')">Save Daily Report</button><button class="secondary" onclick="closeModal()">Cancel</button>${rid?`<button class="secondary" onclick="downloadDailyReport('${x.id}')">Download PDF</button>`:''}</div>`);$('drp').value=x.project_id||'';setupDailySignature('drsig','drsigval',x.engineer_signature||'');setupDailySignature('drclientsig','drclientsigval',x.client_signature||'')}
function setupDailySignature(canvasId,inputId,data){let c=$(canvasId),ctx=c.getContext('2d');ctx.lineWidth=2;ctx.lineCap='round';if(data){let img=new Image();img.onload=()=>ctx.drawImage(img,0,0,c.width,c.height);img.src=data}let drawing=false,last=null;const pos=e=>{let r=c.getBoundingClientRect(),p=e.touches?.[0]||e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}};const start=e=>{e.preventDefault();drawing=true;last=pos(e)};const move=e=>{if(!drawing)return;e.preventDefault();let p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};const end=e=>{if(!drawing)return;drawing=false;$(inputId).value=c.toDataURL('image/png')};c.onpointerdown=start;c.onpointermove=move;c.onpointerup=end;c.onpointerleave=end;c.ontouchstart=start;c.ontouchmove=move;c.ontouchend=end}
function clearDailySignature(canvasId,inputId){let c=$(canvasId);c.getContext('2d').clearRect(0,0,c.width,c.height);$(inputId).value=''}
async function saveDailyReport(rid){let p=projects.find(a=>a.id===$('drp').value),existing=dailyReports.find(a=>a.id===rid),x={id:rid,project_id:$('drp').value||null,project_name:p?.name||'',site:p?.site||'',report_date:$('drdate').value,engineers:$('dreng').value.trim(),hours_worked:$('drhours').value?Number($('drhours').value):null,weather:$('drweather').value.trim(),work_completed:$('drwork').value.trim(),progress:$('drprogress').value.trim(),access_issues:$('draccess').value.trim(),plant_equipment:$('drplant').value.trim(),materials:$('drmat').value.trim(),delays:$('drdelay').value.trim(),defects:$('drdefects').value.trim(),additional_works:$('dradd').value.trim(),safety_issues:$('drsafe').value.trim(),photos:Array.isArray(existing?.photos)?existing.photos:[],engineer_name:$('drengname').value.trim(),engineer_signature:$('drsigval').value||'',client_name:$('drclient').value.trim(),client_signature:$('drclientsigval').value||'',client_signed_at:$('drclientsigval').value?new Date().toISOString():existing?.client_signed_at||null};if(!x.project_id)return alert('Please select a project.');if(!x.report_date)return alert('Report date is required.');if(!x.work_completed)return alert('Please describe the work completed.');let q=await sb.from('daily_reports').upsert(x);if(q.error)return alert(q.error.message);let files=[...($('drphotos')?.files||[])];for(let f of files){let safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`daily-reports/${rid}/${Date.now()}-${safe}`;let up=await sb.storage.from('project-documents').upload(path,f,{upsert:false,contentType:f.type||'image/jpeg'});if(up.error)return alert('Report saved, but photo upload failed: '+up.error.message);x.photos.push({path,name:f.name});}if(files.length){let uq=await sb.from('daily_reports').update({photos:x.photos}).eq('id',rid);if(uq.error)return alert('Report saved, but photo details could not be saved: '+uq.error.message)}closeModal();load()}
async function viewDailyPhoto(path){let r=await sb.storage.from('project-documents').createSignedUrl(path,3600);if(r.error)return alert(r.error.message);window.open(r.data.signedUrl,'_blank')}
async function deleteDailyReport(rid){if(!confirm('Delete this daily report?'))return;let x=dailyReports.find(a=>a.id===rid);if(x?.photos?.length)await sb.storage.from('project-documents').remove(x.photos.map(p=>p.path).filter(Boolean));let q=await sb.from('daily_reports').delete().eq('id',rid);if(q.error)alert(q.error.message);else load()}
function addDailyPdfSection(parent,title,text){let h=document.createElement('h2');h.textContent=title;parent.appendChild(h);let b=document.createElement('div');b.className='box';b.textContent=text||'';parent.appendChild(b)}
async function ensureJsPdf(){if(window.jspdf?.jsPDF)return;await new Promise((resolve,reject)=>{let sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('Could not load the PDF generator. Check your internet connection.'));document.head.appendChild(sc)})}
function pdfText(doc,text,x,y,maxWidth,lineHeight,fontSize){doc.setFontSize(fontSize||9);let lines=doc.splitTextToSize(String(text||''),maxWidth);for(let line of lines){if(y>280){doc.addPage();y=18}doc.text(line,x,y);y+=lineHeight||5}return y}
async function imageUrlToData(url){let r=await fetch(url);if(!r.ok)throw new Error('Could not load report image');let b=await r.blob();return await new Promise((resolve,reject)=>{let fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(b)})}
async function downloadDailyReport(rid){let x=dailyReports.find(a=>a.id===rid);if(!x)return alert('Daily report not found.');try{await ensureJsPdf();let doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});let W=210,M=14,y=16;doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text('ONE CLICK ELECTRICAL',M,y);y+=8;doc.setFontSize(15);doc.text('Daily Site Report',M,y);y+=6;doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text((x.project_name||'')+' — '+(x.report_date||''),M,y);y+=9;doc.setLineWidth(.5);doc.line(M,y,W-M,y);y+=8;
let section=(title,text)=>{if(y>268){doc.addPage();y=18}doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(title,M,y);y+=6;doc.setFont('helvetica','normal');y=pdfText(doc,text,M,y,W-2*M,5,9);y+=5};
section('1. Project & site details','Project: '+(x.project_name||'')+'\nSite: '+(x.site||'')+'\nReport date: '+(x.report_date||'')+'\nHours worked: '+(x.hours_worked??'')+'\nEngineer(s) on site: '+(x.engineers||'')+'\nWeather / site conditions: '+(x.weather||''));
section('2. Work & progress','Work completed:\n'+(x.work_completed||'')+'\n\nProgress / status:\n'+(x.progress||''));
section('3. Site information','Access / site issues:\n'+(x.access_issues||'')+'\n\nPlant / equipment:\n'+(x.plant_equipment||'')+'\n\nMaterials used / delivered:\n'+(x.materials||'')+'\n\nDelays / constraints:\n'+(x.delays||'')+'\n\nDefects / snags:\n'+(x.defects||'')+'\n\nAdditional works / variations:\n'+(x.additional_works||'')+'\n\nHealth & safety / incidents / observations:\n'+(x.safety_issues||''));
if(Array.isArray(x.photos)&&x.photos.length){if(y>250){doc.addPage();y=18}doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('4. Site photos',M,y);y+=7;for(let ph of x.photos){try{let u=await sb.storage.from('project-documents').createSignedUrl(ph.path,3600);if(u.data?.signedUrl){let data=await imageUrlToData(u.data.signedUrl);let props=doc.getImageProperties(data);let maxW=82,maxH=60,ratio=Math.min(maxW/props.width,maxH/props.height);let iw=props.width*ratio,ih=props.height*ratio;if(y+ih+12>282){doc.addPage();y=18}doc.addImage(data,'JPEG',M,y,iw,ih);doc.setFont('helvetica','normal');doc.setFontSize(7);doc.text(ph.name||'Site photo',M,y+ih+4);y+=ih+10}}catch(e){doc.setFontSize(7);doc.text('Photo unavailable: '+(ph.name||'Site photo'),M,y);y+=5}}}
if(y>250){doc.addPage();y=18}doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('5. Sign-off',M,y);y+=7;doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text('Engineer: '+(x.engineer_name||''),M,y);doc.text('Client / Site Manager: '+(x.client_name||''),108,y);y+=5;
if(x.engineer_signature){try{doc.addImage(x.engineer_signature,'PNG',M,y,65,20)}catch(e){}}if(x.client_signature){try{doc.addImage(x.client_signature,'PNG',108,y,65,20)}catch(e){}}y+=27;doc.setFontSize(7);doc.text('This daily report records the work and site conditions reported for the date shown. Additional records, permits, RAMS and client requirements remain applicable.',M,y,{maxWidth:W-2*M});let fn='Daily_Site_Report_'+(x.project_name||'Project').replace(/[^a-zA-Z0-9 _-]/g,'').trim().replace(/\s+/g,'_')+'_'+(x.report_date||'report')+'.pdf';doc.save(fn)}catch(e){alert('PDF download failed: '+e.message)}}
