<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Project Control</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:16px;position:sticky;top:0}main{max-width:1000px;margin:auto;padding:16px}.nav{display:flex;gap:6px;overflow:auto;background:#fff;padding:10px;position:sticky;top:64px}.nav button,.actions button{padding:10px;border:0;border-radius:9px;font-weight:700}.nav .active{background:#2563eb;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px}.stat{font-size:30px;font-weight:800}.muted{color:#6b7280}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:9px;font:inherit}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}.item.docItem{cursor:pointer}.item.docItem:hover{background:#f9fafb}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.primary{background:#2563eb;color:#fff}.danger{background:#dc2626;color:#fff}.secondary{background:#e5e7eb}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center}.modal.hidden{display:none}.modalbox{background:white;width:100%;max-width:720px;max-height:94vh;overflow:auto;padding:18px;border-radius:18px 18px 0 0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#e5e7eb}.good{background:#d1fae5;color:#065f46}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.item{border-top:1px solid #e5e7eb;padding:12px 0}@media(min-width:700px){.modal{align-items:center}.modalbox{border-radius:18px}}</style></head><body><div id="login" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div class="card" style="max-width:420px;width:100%"><h1>Project Control</h1><p class="muted">Sign in to your cloud project system.</p><div id="authmsg"></div><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><div class="actions"><button class="primary" onclick="signIn()">Sign in</button><button class="secondary" onclick="signUp()">Create account</button></div></div></div><div id="appShell" style="display:none"><header><div style="display:flex;justify-content:space-between;align-items:center"><div><strong style="font-size:21px">Project Control</strong><br><small>Projects • Engineers • Paperwork</small></div><button class="secondary" onclick="signOut()">Sign out</button></div></header><div class="nav" id="nav"></div><main id="main"></main></div><div id="modal" class="modal hidden"><div class="modalbox"><div style="display:flex;justify-content:space-between"><h2 id="mt"></h2><button class="secondary" onclick="closeModal()">Close</button></div><div id="mb"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://lympnshxwirqvsnorfqb.supabase.co','sb_publishable_AlEDTKVhif5C89X-bLc3qQ_Bd4hDYaS');let page='dashboard',projects=[],engineers=[],docs=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const id=()=>crypto.randomUUID();function nav(){let n=[['dashboard','Dashboard'],['projects','Projects'],['engineers','Engineers'],['documents','Paperwork']];$('nav').innerHTML=n.map(x=>`<button class="${page==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}async function go(p){page=p;nav();render()}async function signIn(){let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('authmsg').innerHTML='<p class="bad">'+esc(r.error.message)+'</p>'}async function signUp(){let r=await sb.auth.signUp({email:$('email').value,password:$('password').value});$('authmsg').innerHTML=r.error?'<p class="bad">'+esc(r.error.message)+'</p>':'<p class="good">Account created. Check your email if confirmation is required.</p>'}async function signOut(){await sb.auth.signOut()}async function load(){let p=await sb.from('projects').select('*').order('created_at',{ascending:false}),e=await sb.from('engineers').select('*').order('name'),d=await sb.from('documents').select('*').order('created_at',{ascending:false});if(p.error||e.error||d.error){alert((p.error||e.error||d.error).message);return}projects=p.data||[];engineers=e.data||[];docs=d.data||[];nav();render()}function render(){if(page==='dashboard')dash();if(page==='projects')projectPage();if(page==='engineers')engineerPage();if(page==='documents')docPage()}function dash(){$('main').innerHTML=`<h2>Dashboard</h2><div class="grid"><div class="card"><div class="muted">Active projects</div><div class="stat">${projects.filter(p=>p.status==='Active').length}</div></div><div class="card"><div class="muted">Engineers</div><div class="stat">${engineers.length}</div></div><div class="card"><div class="muted">Paperwork</div><div class="stat">${docs.length}</div></div><div class="card"><div class="muted">Expiring in 30 days</div><div class="stat">${docs.filter(d=>d.expiry_date&&days(d.expiry_date)<=30).length}</div></div></div><div class="actions"><button class="primary" onclick="projectForm()">+ Add project</button><button class="secondary" onclick="engineerForm()">+ Add engineer</button><button class="secondary" onclick="docForm()">+ Add paperwork</button></div>`}function projectPage(){$('main').innerHTML=`<div class="actions"><h2 style="margin-right:auto">Projects</h2><button class="primary" onclick="projectForm()">+ Add project</button></div><div class="grid">${projects.map(p=>{let en=(p.engineer_ids||[]).map(x=>engineers.find(e=>e.id===x)?.name).filter(Boolean).join(', ');return `<div class="card"><div><h3>${esc(p.name)} <span class="badge ${p.status==='Active'?'good':''}">${esc(p.status)}</span></h3><p class="muted">${esc(p.client||'')}<br>${esc(p.site||'')}</p><p><b>Engineers:</b> ${esc(en||'None')}<br><b>Paperwork:</b> ${docs.filter(d=>d.project_id===p.id).length}</p><div class="actions"><button onclick="projectForm('${p.id}')">Edit</button><button class="secondary" onclick="docForm(null,'${p.id}')">+ Paperwork</button><button class="danger" onclick="deleteProject('${p.id}')">Delete</button></div></div></div>`}).join('')||'<div class="card muted">No projects yet.</div>'}</div>`}function engineerPage(){$('main').innerHTML=`<div class="actions"><h2 style="margin-right:auto">Engineers</h2><button class="primary" onclick="engineerForm()">+ Add engineer</button></div><div class="grid">${engineers.map(e=>`<div class="card"><h3>${esc(e.name)} <span class="badge ${e.status==='Active'?'good':''}">${esc(e.status)}</span></h3><p class="muted">${esc(e.phone||'')}<br>${esc(e.email||'')}</p><p><b>Qualifications:</b> ${esc(e.qualifications||'None')}<br><b>Expiry:</b> ${esc(e.cert_expiry||'Not set')}</p><div class="actions"><button onclick="engineerForm('${e.id}')">Edit</button><button class="danger" onclick="deleteEngineer('${e.id}')">Delete</button></div></div>`).join('')||'<div class="card muted">No engineers yet.</div>'}</div>`}function docPage(){$('main').innerHTML=`<div class="actions"><h2 style="margin-right:auto">Paperwork</h2><button class="primary" onclick="docForm()">+ Add paperwork</button></div><div class="card">${docs.map(d=>{let p=projects.find(x=>x.id===d.project_id),n=d.expiry_date?days(d.expiry_date):null;return `<div class="item"><div><b>${esc(d.name)}</b> <span class="badge">${esc(d.type)}</span> ${n!==null?`<span class="badge ${n<0?'bad':n<=30?'warn':'good'}">${n<0?'Expired':n+' days left'}</span>`:''}</div><div class="muted">${esc(p?.name||'Unassigned')} • v${esc(d.version||'1.0')} • ${esc(d.approval_status||'Draft')} • ${esc(d.file_name||'No attachment')}</div><div class="actions"><button class="primary" onclick="docForm('${d.id}')">Edit</button><button class="secondary" onclick="viewDoc('${d.id}')">Details</button><button class="danger" onclick="deleteDoc('${d.id}')">Delete</button></div></div>`}).join('')||'<div class="muted">No paperwork yet.</div>'}</div>`}function openModal(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function projectForm(pid){let p=projects.find(x=>x.id===pid)||{id:id(),name:'',reference:'',client:'',site:'',start_date:'',end_date:'',status:'Active',notes:'',engineer_ids:[]};openModal(pid?'Edit project':'Add project',`<label>Name *</label><input id="pn" value="${esc(p.name)}"><label>Reference</label><input id="pr" value="${esc(p.reference)}"><label>Client</label><input id="pc" value="${esc(p.client)}"><label>Site</label><input id="ps" value="${esc(p.site)}"><div class="grid"><div><label>Start</label><input id="pd1" type="date" value="${p.start_date||''}"></div><div><label>End</label><input id="pd2" type="date" value="${p.end_date||''}"></div></div><label>Status</label><select id="pst"><option>Active</option><option>Planned</option><option>On Hold</option><option>Complete</option></select><label>Assign engineers</label><select id="pei" multiple size="5">${engineers.map(e=>`<option value="${e.id}" ${(p.engineer_ids||[]).includes(e.id)?'selected':''}>${esc(e.name)}</option>`).join('')}</select><label>Notes</label><textarea id="pno">${esc(p.notes)}</textarea><div class="actions"><button class="primary" onclick="saveProject('${p.id}')">Save</button></div>`);$('pst').value=p.status}async function saveProject(pid){let x={id:pid,name:$('pn').value.trim(),reference:$('pr').value,client:$('pc').value,site:$('ps').value,start_date:$('pd1').value||null,end_date:$('pd2').value||null,status:$('pst').value,notes:$('pno').value,engineer_ids:[...$('pei').selectedOptions].map(o=>o.value)};if(!x.name)return alert('Project name is required');let r=await sb.from('projects').upsert(x);if(r.error)return alert(r.error.message);closeModal();load()}async function deleteProject(x){if(confirm('Delete project and linked paperwork?')){let r=await sb.from('projects').delete().eq('id',x);if(r.error)alert(r.error.message);else load()}}function engineerForm(eid){let e=engineers.find(x=>x.id===eid)||{id:id(),name:'',phone:'',email:'',qualifications:'',cert_expiry:'',status:'Active'};openModal(eid?'Edit engineer':'Add engineer',`<label>Name *</label><input id="en" value="${esc(e.name)}"><label>Phone</label><input id="ep" value="${esc(e.phone)}"><label>Email</label><input id="ee" value="${esc(e.email)}"><label>Qualifications</label><input id="eq" value="${esc(e.qualifications)}"><label>Certification expiry</label><input id="ex" type="date" value="${e.cert_expiry||''}"><label>Status</label><select id="es"><option>Active</option><option>Unavailable</option></select><div class="actions"><button class="primary" onclick="saveEngineer('${e.id}')">Save</button></div>`);$('es').value=e.status}async function saveEngineer(eid){let x={id:eid,name:$('en').value.trim(),phone:$('ep').value,email:$('ee').value,qualifications:$('eq').value,cert_expiry:$('ex').value||null,status:$('es').value};if(!x.name)return alert('Engineer name is required');let r=await sb.from('engineers').upsert(x);if(r.error)return alert(r.error.message);closeModal();load()}async function deleteEngineer(x){if(confirm('Delete engineer?')){let r=await sb.from('engineers').delete().eq('id',x);if(r.error)alert(r.error.message);else load()}}function docForm(did,pid){let d=docs.find(x=>x.id===did)||{id:id(),name:'',type:'Risk Assessment',project_id:pid||'',document_date:new Date().toISOString().slice(0,10),expiry_date:'',version:'1.0',notes:''};openModal(did?'Edit paperwork':'Add paperwork',`<label>Name *</label><input id="dn" value="${esc(d.name)}"><label>Type</label><select id="dt"><option>Risk Assessment</option><option>RAMS / Method Statement</option><option>Subcontractor Agreement</option><option>Electrical Certificate</option><option>Permit</option><option>Safe Isolation</option><option>Toolbox Talk</option><option>Site Induction</option><option>Training / Certification</option><option>Client Document</option><option>Photo</option><option>Other</option></select><label>Project</label><select id="dp"><option value="">Unassigned</option>${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><div class="grid"><div><label>Date</label><input id="dd" type="date" value="${d.document_date||''}"></div><div><label>Expiry/review</label><input id="dx" type="date" value="${d.expiry_date||''}"></div></div><label>Version</label><input id="dv" value="${esc(d.version||'1.0')}"><label>Approval Status</label><select id="da"><option>Draft</option><option>Submitted</option><option>Awaiting Approval</option><option>Approved</option><option>Rejected</option></select><label>Attachment</label><input id="df" type="file"><label>Notes</label><textarea id="dno">${esc(d.notes||'')}</textarea><div class="actions"><button class="primary" onclick="saveDoc('${d.id}')">Save</button></div>`);$('dt').value=d.type;$('dp').value=d.project_id||'';$('da').value=d.approval_status||'Draft'}async function saveDoc(did){let x={id:did,name:$('dn').value.trim(),type:$('dt').value,project_id:$('dp').value||null,document_date:$('dd').value||null,expiry_date:$('dx').value||null,version:$('dv').value||'1.0',approval_status:$('da')?.value||'Draft',notes:$('dno').value};if(!x.name)return alert('Document name is required');let f=$('df').files[0];if(f){let path=crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');let u=await sb.storage.from('project-documents').upload(path,f);if(u.error)return alert(u.error.message);x.storage_path=path;x.file_name=f.name;x.file_size=f.size;x.mime_type=f.type}let r=await sb.from('documents').upsert(x);if(r.error)alert(r.error.message);else{closeModal();load()}}async function viewDoc(did){let d=docs.find(x=>x.id===did),link='';if(d.storage_path){let r=await sb.storage.from('project-documents').createSignedUrl(d.storage_path,300);if(!r.error)link=`<p><a class="primary" style="padding:10px;border-radius:9px;color:white;text-decoration:none" href="${r.data.signedUrl}" target="_blank">Open attachment</a></p>`}openModal('Paperwork details',`<p><b>${esc(d.name)}</b></p><p>${esc(d.type)} • Version ${esc(d.version)}</p><p>Project: ${esc(projects.find(p=>p.id===d.project_id)?.name||'Unassigned')}</p><p><b>Approval Status:</b> ${esc(d.approval_status||'Draft')}</p><p>${esc(d.notes||'No notes')}</p>${link}<div class="actions"><button class="primary" onclick="closeModal();docForm('${d.id}')">Edit</button><button class="secondary" onclick="closeModal()">Close</button></div>`)}async function deleteDoc(x){if(confirm('Delete paperwork?')){let d=docs.find(a=>a.id===x);if(d?.storage_path)await sb.storage.from('project-documents').remove([d.storage_path]);let r=await sb.from('documents').delete().eq('id',x);if(r.error)alert(r.error.message);else load()}}function days(d){return Math.ceil((new Date(d+'T23:59:59')-new Date())/86400000)}(async()=>{let s=await sb.auth.getSession();if(s.data.session){$('login').style.display='none';$('appShell').style.display='block';await load()}sb.auth.onAuthStateChange(async(_,s)=>{if(s){$('login').style.display='none';$('appShell').style.display='block';await load()}else{$('appShell').style.display='none';$('login').style.display='flex'}})})();</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script></body></html>
