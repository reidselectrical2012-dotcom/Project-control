<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Project Control</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--danger:#dc2626;--warn:#d97706;--good:#059669}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:#111827;color:white;padding:18px 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px}header small{opacity:.75}
nav{display:flex;gap:6px;overflow:auto;padding:10px;background:white;border-bottom:1px solid var(--line);position:sticky;top:70px;z-index:4}
nav button{border:0;background:#f3f4f6;padding:9px 13px;border-radius:999px;white-space:nowrap;font-weight:600}
nav button.active{background:var(--accent);color:white}
main{max-width:1100px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px #00000008}
.stat{font-size:30px;font-weight:800}.muted{color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{flex-wrap:wrap}
button,.btn{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;font-weight:700;background:var(--accent);color:#fff}
button.secondary,.btn.secondary{background:#e5e7eb;color:#111827}
button.danger{background:var(--danger)}
input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;font:inherit;background:white}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;font-weight:700;display:block;margin:10px 0 5px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.item{padding:12px 0;border-top:1px solid var(--line)}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#e5e7eb}
.good{background:#d1fae5;color:#065f46}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
.hidden{display:none!important}.empty{text-align:center;padding:30px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modalbox{background:white;width:100%;max-width:700px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
@media(min-width:700px){.modal{align-items:center}.modalbox{border-radius:18px}}
.file{font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
h2{margin-top:4px}h3{margin-bottom:5px}
</style>
</head>
<body>
<header><h1>Project Control</h1><small>Projects • Engineers • Compliance • Paperwork</small></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="row"><h2 id="modalTitle"></h2><button class="secondary" onclick="closeModal()">Close</button></div><div id="modalBody"></div></div></div>
<script>
const KEY='project-control-v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{projects:[],engineers:[],docs:[]};
let page='dashboard';
const navItems=[['dashboard','Dashboard'],['projects','Projects'],['engineers','Engineers'],['documents','Paperwork']];

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function nav(){document.getElementById('nav').innerHTML=navItems.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(p){page=p;nav();render()}
function render(){let a=document.getElementById('app'); if(page==='dashboard')dashboard(a); if(page==='projects')projects(a); if(page==='engineers')engineers(a); if(page==='documents')documents(a)}
function dashboard(a){
 const active=db.projects.filter(p=>p.status==='Active').length;
 const exp=db.docs.filter(d=>d.expiry&&daysTo(d.expiry)<=30).length;
 const missing=db.projects.filter(p=>!db.docs.some(d=>d.projectId===p.id&&/ram/i.test(d.type))).length;
 a.innerHTML=`<div class="row wrap"><div><h2>Dashboard</h2><span class="muted">Quick overview of your workload</span></div><button onclick="projectForm()">+ Add project</button></div>
 <div class="grid" style="margin-top:14px">
 <div class="card"><div class="muted">Active projects</div><div class="stat">${active}</div></div>
 <div class="card"><div class="muted">Engineers</div><div class="stat">${db.engineers.length}</div></div>
 <div class="card"><div class="muted">Documents</div><div class="stat">${db.docs.length}</div></div>
 <div class="card"><div class="muted">Expiry / review in 30 days</div><div class="stat">${exp}</div></div></div>
 <div class="grid" style="margin-top:14px"><div class="card"><h3>Compliance attention</h3>
 ${missing?`<p class="bad badge">${missing} project(s) have no RAMS paperwork linked.</p>`:'<p class="good badge">No missing RAMS detected.</p>'}
 ${exp?`<p class="warn badge">${exp} document(s) need attention within 30 days.</p>`:'<p class="good badge">No documents due within 30 days.</p>'}</div>
 <div class="card"><h3>Recent projects</h3>${db.projects.slice(-5).reverse().map(projectLine).join('')||'<div class="empty">No projects yet.</div>'}</div></div>`;
}
function projectLine(p){let n=(p.engineerIds||[]).map(id=>db.engineers.find(e=>e.id===id)?.name).filter(Boolean).join(', ');return `<div class="item"><div class="row"><strong>${esc(p.name)}</strong><span class="badge ${p.status==='Active'?'good':''}">${esc(p.status)}</span></div><div class="muted">${esc(p.client||'')} ${n?'• '+esc(n):''}</div></div>`}
function projects(a){
 a.innerHTML=`<div class="row wrap"><div><h2>Projects</h2><span class="muted">${db.projects.length} project(s)</span></div><button onclick="projectForm()">+ Add project</button></div>
 <div style="margin:12px 0"><input placeholder="Search projects..." oninput="filterProjects(this.value)"></div><div id="projectList" class="grid">${db.projects.map(projectCard).join('')||'<div class="card empty">Add your first project.</div>'}</div>`;
}
function projectCard(p){let docs=db.docs.filter(d=>d.projectId===p.id).length;let ens=(p.engineerIds||[]).map(id=>db.engineers.find(e=>e.id===id)?.name).filter(Boolean);return `<div class="card projectCard" data-search="${esc((p.name+' '+p.client+' '+p.site).toLowerCase())}"><div class="row"><h3>${esc(p.name)}</h3><span class="badge ${p.status==='Active'?'good':p.status==='On Hold'?'warn':''}">${esc(p.status)}</span></div><p class="muted">${esc(p.client||'')}<br>${esc(p.site||'')}</p><p><strong>Engineers:</strong> ${esc(ens.join(', ')||'None')}<br><strong>Paperwork:</strong> ${docs}</p><div class="actions"><button onclick="projectForm('${p.id}')">Edit</button><button class="secondary" onclick="documentForm(null,'${p.id}')">+ Paperwork</button><button class="danger" onclick="deleteProject('${p.id}')">Delete</button></div></div>`}
function filterProjects(q){q=q.toLowerCase();document.querySelectorAll('.projectCard').forEach(x=>x.style.display=x.dataset.search.includes(q)?'block':'none')}
function projectForm(id){
 let p=db.projects.find(x=>x.id===id)||{id:uid(),name:'',client:'',site:'',reference:'',start:'',end:'',status:'Active',notes:'',engineerIds:[]};
 openModal(id?'Edit project':'Add project',`<div class="formgrid">
 <div><label>Project name *</label><input id="pn" value="${esc(p.name)}"></div><div><label>Project reference</label><input id="pr" value="${esc(p.reference)}"></div>
 <div><label>Client</label><input id="pc" value="${esc(p.client)}"></div><div><label>Site</label><input id="ps" value="${esc(p.site)}"></div>
 <div><label>Start date</label><input id="pd1" type="date" value="${p.start}"></div><div><label>End date</label><input id="pd2" type="date" value="${p.end}"></div>
 <div><label>Status</label><select id="pst"><option>Active</option><option>Planned</option><option>On Hold</option><option>Complete</option></select></div>
 </div><label>Assign engineers</label><select id="pei" multiple size="5">${db.engineers.map(e=>`<option value="${e.id}" ${(p.engineerIds||[]).includes(e.id)?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
 <label>Notes</label><textarea id="pno">${esc(p.notes)}</textarea>
 <div class="actions"><button onclick="saveProject('${p.id}')">Save project</button></div>`);
 document.getElementById('pst').value=p.status;
}
function saveProject(id){let p=db.projects.find(x=>x.id===id); if(!p){p={id};db.projects.push(p)}
 Object.assign(p,{name:pn.value.trim(),reference:pr.value,client:pc.value,site:ps.value,start:pd1.value,end:pd2.value,status:pst.value,notes:pno.value,engineerIds:[...pei.selectedOptions].map(o=>o.value)});
 if(!p.name)return alert('Project name is required');save();closeModal();render()}
function deleteProject(id){if(confirm('Delete this project and its linked paperwork?')){db.projects=db.projects.filter(p=>p.id!==id);db.docs=db.docs.filter(d=>d.projectId!==id);save();render()}}
function engineers(a){
 a.innerHTML=`<div class="row wrap"><div><h2>Engineers</h2><span class="muted">${db.engineers.length} engineer(s)</span></div><button onclick="engineerForm()">+ Add engineer</button></div>
 <div class="grid" style="margin-top:14px">${db.engineers.map(e=>`<div class="card"><div class="row"><h3>${esc(e.name)}</h3><span class="badge ${e.status==='Active'?'good':'warn'}">${esc(e.status)}</span></div><p class="muted">${esc(e.phone||'')}<br>${esc(e.email||'')}</p><p><strong>Certifications:</strong> ${esc(e.certs||'None')}<br><strong>Expiry:</strong> ${esc(e.certExpiry||'Not set')}</p><div class="actions"><button onclick="engineerForm('${e.id}')">Edit</button><button class="danger" onclick="deleteEngineer('${e.id}')">Delete</button></div></div>`).join('')||'<div class="card empty">Add your first engineer.</div>'}</div>`;
}
function engineerForm(id){let e=db.engineers.find(x=>x.id===id)||{id:uid(),name:'',phone:'',email:'',certs:'',certExpiry:'',status:'Active'};
 openModal(id?'Edit engineer':'Add engineer',`<div class="formgrid"><div><label>Name *</label><input id="en" value="${esc(e.name)}"></div><div><label>Phone</label><input id="ep" value="${esc(e.phone)}"></div><div><label>Email</label><input id="ee" value="${esc(e.email)}"></div><div><label>Certification / qualification summary</label><input id="ec" value="${esc(e.certs)}"></div><div><label>Certification expiry</label><input id="ex" type="date" value="${e.certExpiry}"></div><div><label>Status</label><select id="es"><option>Active</option><option>Unavailable</option></select></div></div><div class="actions"><button onclick="saveEngineer('${e.id}')">Save engineer</button></div>`);es.value=e.status}
function saveEngineer(id){let e=db.engineers.find(x=>x.id===id);if(!e){e={id};db.engineers.push(e)}Object.assign(e,{name:en.value.trim(),phone:ep.value,email:ee.value,certs:ec.value,certExpiry:ex.value,status:es.value});if(!e.name)return alert('Engineer name is required');save();closeModal();render()}
function deleteEngineer(id){if(confirm('Delete this engineer?')){db.engineers=db.engineers.filter(e=>e.id!==id);db.projects.forEach(p=>p.engineerIds=(p.engineerIds||[]).filter(x=>x!==id));save();render()}}
function documents(a){
 a.innerHTML=`<div class="row wrap"><div><h2>Paperwork</h2><span class="muted">${db.docs.length} document(s)</span></div><button onclick="documentForm()">+ Add paperwork</button></div>
 <div style="margin:12px 0"><input placeholder="Search paperwork..." oninput="filterDocs(this.value)"></div>
 <div class="card">${db.docs.map(docLine).join('')||'<div class="empty">No paperwork uploaded yet.</div>'}</div>`;
}
function docLine(d){let p=db.projects.find(x=>x.id===d.projectId);let exp=d.expiry?daysTo(d.expiry):null;let cls=exp!==null&&exp<0?'bad':exp!==null&&exp<=30?'warn':'good';return `<div class="item docItem" data-search="${esc((d.name+' '+d.type+' '+(p?.name||'')).toLowerCase())}"><div class="row wrap"><div><strong>${esc(d.name)}</strong> <span class="badge">${esc(d.type)}</span></div><span class="badge ${cls}">${d.expiry?(exp<0?'Expired':exp+' days left'):'No expiry'}</span></div><div class="muted">Project: ${esc(p?.name||'Unassigned')} • Version ${esc(d.version||'1.0')} • ${esc(d.date||'')}</div><div class="file">${d.fileName?'📎 '+esc(d.fileName):'No file attached'}</div><div class="actions"><button class="secondary" onclick="viewDoc('${d.id}')">View details</button><button class="danger" onclick="deleteDoc('${d.id}')">Delete</button></div></div>`}
function filterDocs(q){q=q.toLowerCase();document.querySelectorAll('.docItem').forEach(x=>x.style.display=x.dataset.search.includes(q)?'block':'none')}
function documentForm(id,projectId){
 let d=db.docs.find(x=>x.id===id)||{id:uid(),name:'',type:'Risk Assessment',projectId:projectId||'',date:new Date().toISOString().slice(0,10),expiry:'',version:'1.0',notes:'',fileName:'',fileData:''};
 openModal(id?'Edit paperwork':'Add paperwork',`<div class="formgrid"><div><label>Document name *</label><input id="dn" value="${esc(d.name)}"></div><div><label>Type</label><select id="dt"><option>Risk Assessment</option><option>RAMS / Method Statement</option><option>Subcontractor Agreement</option><option>Electrical Certificate</option><option>Permit</option><option>Safe Isolation</option><option>Toolbox Talk</option><option>Site Induction</option><option>Training / Certification</option><option>Client Document</option><option>Photo</option><option>Other</option></select></div><div><label>Project</label><select id="dp"><option value="">Unassigned</option>${db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div><label>Date</label><input id="dd" type="date" value="${d.date}"></div><div><label>Expiry / review date</label><input id="dx" type="date" value="${d.expiry}"></div><div><label>Version</label><input id="dv" value="${esc(d.version)}"></div></div><label>Attach file</label><input id="df" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.xlsx,.xls"><small class="muted">For this starter version, attachments are stored locally in this browser.</small><label>Notes</label><textarea id="dno">${esc(d.notes)}</textarea><div class="actions"><button onclick="saveDoc('${d.id}')">Save paperwork</button></div>`);
 dt.value=d.type;dp.value=d.projectId;
}
function saveDoc(id){let d=db.docs.find(x=>x.id===id);if(!d){d={id};db.docs.push(d)}let f=df.files[0];let done=()=>{Object.assign(d,{name:dn.value.trim(),type:dt.value,projectId:dp.value,date:dd.value,expiry:dx.value,version:dv.value,notes:dno.value});if(!d.name)return alert('Document name is required');save();closeModal();render()};if(f){let r=new FileReader();r.onload=()=>{d.fileName=f.name;d.fileData=r.result;done()};r.readAsDataURL(f)}else done()}
function viewDoc(id){let d=db.docs.find(x=>x.id===id);openModal('Paperwork details',`<p><strong>${esc(d.name)}</strong></p><p>${esc(d.type)} • Version ${esc(d.version)}</p><p>Project: ${esc(db.projects.find(p=>p.id===d.projectId)?.name||'Unassigned')}</p><p>Notes: ${esc(d.notes||'None')}</p>${d.fileData?`<a class="btn" href="${d.fileData}" download="${esc(d.fileName)}">Open / download attachment</a>`:''}<div class="actions"><button onclick="closeModal();documentForm('${d.id}')">Edit</button></div>`)}
function deleteDoc(id){if(confirm('Delete this paperwork?')){db.docs=db.docs.filter(d=>d.id!==id);save();render()}}
function daysTo(date){return Math.ceil((new Date(date+'T23:59:59')-new Date())/86400000)}
function openModal(t,b){modalTitle.textContent=t;modalBody.innerHTML=b;modal.classList.remove('hidden')}
function closeModal(){modal.classList.add('hidden')}
nav();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body></html>
