<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Project Control V2</title><style>body{margin:0;font-family:system-ui;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:16px;position:sticky;top:0}main{max-width:1100px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:16px}.stat{font-size:30px;font-weight:800}.muted{color:#6b7280}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;background:#2563eb;color:#fff}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;font:inherit;box-sizing:border-box}label{font-size:13px;font-weight:700;display:block;margin:10px 0 5px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:20}.modalbox{background:#fff;width:100%;max-height:92vh;overflow:auto;padding:18px;border-radius:18px 18px 0 0}nav{display:flex;gap:6px;overflow:auto;padding:9px;background:#fff;position:sticky;top:68px;z-index:5}nav button{background:#eee;color:#111;white-space:nowrap}nav button.active{background:#2563eb;color:#fff}.badge{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#e5e7eb}.good{background:#d1fae5;color:#065f46}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}@media(min-width:700px){.modal{align-items:center}.modalbox{max-width:760px;border-radius:18px}}</style></head><body><div id="login" class="hidden"><main><div class="card"><h1>Project Control</h1><p class="muted">Sign in to your business system.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="pass" type="password"><div class="actions"><button onclick="signin()">Sign in</button><button onclick="signup()">Create account</button></div><p id="msg"></p></div></main></div><div id="appShell" class="hidden"><header><div class="row"><div><b>Project Control</b><br><small>Projects • Engineers • Paperwork</small></div><button onclick="signout()">Sign out</button></div></header><nav id="nav"></nav><main id="main"></main></div><div id="modal" class="modal hidden"><div class="modalbox"><div class="row"><h2 id="mt"></h2><button onclick="closeModal()">Close</button></div><div id="mb"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://lympnshxwirqvsnorfqb.supabase.co','sb_publishable_AlEDTKVhif5C89X-bLc3qQ_Bd4hDYaS');let page='dashboard',P=[],E=[],D=[];const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function boot(){let {data}=await sb.auth.getSession();if(data.session)show();else $('login').classList.remove('hidden');sb.auth.onAuthStateChange((_e,s)=>{if(s)show();else{ $('appShell').classList.add('hidden');$('login').classList.remove('hidden')}})}async function signin(){let{error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(error)$('msg').textContent=error.message}async function signup(){let{error}=await sb.auth.signUp({email:$('email').value,password:$('pass').value});$('msg').textContent=error?error.message:'Account created. Check your email if confirmation is enabled.'}async function signout(){await sb.auth.signOut()}async function show(){ $('login').classList.add('hidden');$('appShell').classList.remove('hidden');await load();}async function load(){let a=await Promise.all([sb.from('projects').select('*').order('created_at',{ascending:false}),sb.from('engineers').select('*').order('name'),sb.from('documents').select('*').order('created_at',{ascending:false})]);for(let r of a)if(r.error)return alert(r.error.message);P=a[0].data||[];E=a[1].data||[];D=a[2].data||[];render()}function nav(){[['dashboard','Dashboard'],['projects','Projects'],['engineers','Engineers'],['documents','Paperwork']].forEach(()=>{});$('nav').innerHTML=[['dashboard','Dashboard'],['projects','Projects'],['engineers','Engineers'],['documents','Paperwork']].map(x=>`<button class="${page==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}function go(x){page=x;render()}function render(){nav();let m=$('main');if(page==='dashboard')dash(m);if(page==='projects')projects(m);if(page==='engineers')engineers(m);if(page==='documents')documents(m)}function dash(m){let exp=D.filter(x=>x.expiry_date&&days(x.expiry_date)<=30).length;m.innerHTML=`<div class="row"><div><h2>Dashboard</h2><span class="muted">Cloud connected</span></div><button onclick="projectForm()">+ Project</button></div><div class="grid"><div class="card"><span class="muted">Active projects</span><div class="stat">${P.filter(x=>x.status==='Active').length}</div></div><div class="card"><span class="muted">Engineers</span><div class="stat">${E.length}</div></div><div class="card"><span class="muted">Paperwork</span><div class="stat">${D.length}</div></div><div class="card"><span class="muted">Due in 30 days</span><div class="stat">${exp}</div></div></div><div class="card"><h3>Recent projects</h3>${P.slice(0,5).map(p=>`<div style="padding:10px 0;border-top:1px solid #eee"><b>${esc(p.name)}</b> <span class="badge">${esc(p.status)}</span><div class="muted">${esc(p.client||'')} • ${esc(p.site||'')}</div></div>`).join('')||'<p class="muted">No projects yet.</p>'}</div>`}
function projects(m){m.innerHTML=`<div class="row"><h2>Projects</h2><button onclick="projectForm()">+ Project</button></div><input placeholder="Search" oninput="searchCards(this.value)"><div id="cards" class="grid">${P.map(p=>`<div class="card searchable" data-s="${esc((p.name+' '+p.client+' '+p.site).toLowerCase())}"><div class="row"><h3>${esc(p.name)}</h3><span class="badge">${esc(p.status)}</span></div><p class="muted">${esc(p.client||'')}<br>${esc(p.site||'')}</p><p>Engineers: ${esc((p.engineer_ids||[]).map(id=>E.find(e=>e.id===id)?.name).filter(Boolean).join(', ')||'None')}</p><div class="actions"><button onclick="projectForm('${p.id}')">Edit</button><button onclick="documentForm('${p.id}')">+ Paperwork</button></div></div>`).join('')||'<div class="card">No projects yet.</div>'}</div>`}function searchCards(q){q=q.toLowerCase();document.querySelectorAll('.searchable').forEach(x=>x.style.display=x.dataset.s.includes(q)?'block':'none')}
function projectForm(id){let p=P.find(x=>x.id===id)||{id:crypto.randomUUID(),name:'',reference:'',client:'',site:'',start_date:'',end_date:'',status:'Active',notes:'',engineer_ids:[]};openModal(id?'Edit project':'Add project',`<label>Project name</label><input id="pn" value="${esc(p.name)}"><label>Reference</label><input id="pr" value="${esc(p.reference)}"><label>Client</label><input id="pc" value="${esc(p.client)}"><label>Site</label><input id="ps" value="${esc(p.site)}"><label>Status</label><select id="pst"><option>Active</option><option>Planned</option><option>On Hold</option><option>Complete</option></select><label>Assign engineers</label><select id="pei" multiple size="5">${E.map(e=>`<option value="${e.id}" ${(p.engineer_ids||[]).includes(e.id)?'selected':''}>${esc(e.name)}</option>`).join('')}</select><label>Notes</label><textarea id="pno">${esc(p.notes)}</textarea><div class="actions"><button onclick="saveProject('${p.id}')">Save</button></div>`);$('pst').value=p.status}
async function saveProject(id){let x={id,name:$('pn').value.trim(),reference:$('pr').value,client:$('pc').value,site:$('ps').value,status:$('pst').value,notes:$('pno').value,engineer_ids:[...$('pei').selectedOptions].map(o=>o.value)};if(!x.name)return alert('Project name required');let{error}=await sb.from('projects').upsert(x);if(error)alert(error.message);else{closeModal();load()}}
function engineers(m){m.innerHTML=`<div class="row"><h2>Engineers</h2><button onclick="engineerForm()">+ Engineer</button></div><div class="grid">${E.map(e=>`<div class="card"><div class="row"><h3>${esc(e.name)}</h3><span class="badge">${esc(e.status)}</span></div><p>${esc(e.phone||'')}<br>${esc(e.email||'')}</p><p><b>Qualifications:</b> ${esc(e.qualifications||'None')}<br><b>Expiry:</b> ${esc(e.cert_expiry||'Not set')}</p><button onclick="engineerForm('${e.id}')">Edit</button></div>`).join('')||'<div class="card">No engineers yet.</div>'}</div>`}function engineerForm(id){let e=E.find(x=>x.id===id)||{id:crypto.randomUUID(),name:'',phone:'',email:'',qualifications:'',cert_expiry:'',status:'Active'};openModal(id?'Edit engineer':'Add engineer',`<label>Name</label><input id="en" value="${esc(e.name)}"><label>Phone</label><input id="ep" value="${esc(e.phone)}"><label>Email</label><input id="ee" value="${esc(e.email)}"><label>Qualifications</label><input id="eq" value="${esc(e.qualifications)}"><label>Certification expiry</label><input id="ex" type="date" value="${e.cert_expiry||''}"><label>Status</label><select id="es"><option>Active</option><option>Unavailable</option></select><div class="actions"><button onclick="saveEngineer('${e.id}')">Save</button></div>`);$('es').value=e.status}async function saveEngineer(id){let x={id,name:$('en').value.trim(),phone:$('ep').value,email:$('ee').value,qualifications:$('eq').value,cert_expiry:$('ex').value||null,status:$('es').value};if(!x.name)return alert('Engineer name required');let{error}=await sb.from('engineers').upsert(x);if(error)alert(error.message);else{closeModal();load()}}
function documents(m){m.innerHTML=`<div class="row"><h2>Paperwork</h2><button onclick="documentForm()">+ Paperwork</button></div><input placeholder="Search" oninput="searchDocs(this.value)"><div class="card">${D.map(d=>{let p=P.find(x=>x.id===d.project_id),x=d.expiry_date?days(d.expiry_date):null;return `<div class="searchable" data-s="${esc((d.name+' '+d.type+' '+(p?.name||'')).toLowerCase())}" style="padding:12px 0;border-top:1px solid #eee"><b>${esc(d.name)}</b> <span class="badge">${esc(d.type)}</span><div class="muted">${esc(p?.name||'Unassigned')} • v${esc(d.version||'1.0')} ${d.expiry_date?'• '+(x<0?'Expired':x+' days left'):''}</div>${d.file_name?'📎 '+esc(d.file_name):''}</div>`}).join('')||'<p class="muted">No paperwork yet.</p>'}</div>`}function searchDocs(q){q=q.toLowerCase();document.querySelectorAll('.searchable').forEach(x=>x.style.display=x.dataset.s.includes(q)?'block':'none')}
function documentForm(projectId){openModal('Add paperwork',`<label>Document name</label><input id="dn"><label>Type</label><select id="dt"><option>Risk Assessment</option><option>RAMS / Method Statement</option><option>Subcontractor Agreement</option><option>Electrical Certificate</option><option>Permit</option><option>Safe Isolation</option><option>Toolbox Talk</option><option>Site Induction</option><option>Training / Certification</option><option>Client Document</option><option>Photo</option><option>Other</option></select><label>Project</label><select id="dp"><option value="">Unassigned</option>${P.map(p=>`<option value="${p.id}" ${p.id===projectId?'selected':''}>${esc(p.name)}</option>`).join('')}</select><label>Document date</label><input id="dd" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Expiry/review date</label><input id="dx" type="date"><label>Version</label><input id="dv" value="1.0"><label>File</label><input id="df" type="file"><label>Notes</label><textarea id="dno"></textarea><div class="actions"><button onclick="saveDoc()">Save paperwork</button></div>`)}async function saveDoc(){let f=$('df').files[0],x={id:crypto.randomUUID(),name:$('dn').value.trim(),type:$('dt').value,project_id:$('dp').value||null,document_date:$('dd').value||null,expiry_date:$('dx').value||null,version:$('dv').value,notes:$('dno').value};if(!x.name)return alert('Document name required');if(f){let path=crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),u=await sb.storage.from('project-documents').upload(path,f);if(u.error)return alert(u.error.message);Object.assign(x,{storage_path:path,file_name:f.name,file_size:f.size,mime_type:f.type})}let{error}=await sb.from('documents').insert(x);if(error)alert(error.message);else{closeModal();load()}}function openModal(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function days(d){return Math.ceil((new Date(d+'T23:59:59')-new Date())/86400000)}boot();</script></body></html>
