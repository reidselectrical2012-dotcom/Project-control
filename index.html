:center;justify-content:center;padding:20px"><div class="card" style="max-width:420px;width:100%"><h1>Project Control</h1><p class="muted">Sign in to your cloud project system.</p><div id="authmsg"></div><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><div class="actions"><button class="primary" onclick="signIn()">Sign in</button><button class="secondary" onclick="signUp()">Create account</button></div></div></div><div id="appShell" style="display:none"><header><div style="display:flex;justify-content:space-between;align-items:center"><div><strong style="font-size:21px">Project Control</strong><br><small>Projects • Engineers • Paperwork</small></div><button class="secondary" onclick="signOut()">Sign out</button></div></header><div class="nav" id="nav"></div><main id="main"></main></div><div id="modal" class="modal hidden"><div class="modalbox"><div style="display:flex;justify-content:space-between"><h2 id="mt"></h2><button class="secondary" onclick="closeModal()">Close</button></div><div id="mb"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://lympnshxwirqvsnorfqb.supabase.co','sb_publishable_AlEDTKVhif5C89X-bLc3qQ_Bd4hDYaS');let page='dashboard',projects=[],engineers=[],docs=[],rams=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const id=()=>crypto.randomUUID();function nav(){let n=[['dashboard','Dashboard'],['projects','Projects'],['engineers','Engineers'],['documents','Paperwork'],['rams','RAMS Creator']];$('nav').innerHTML=n.map(x=>`<button class="${page==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}async function go(p){page=p;nav();render()}async function signIn(){let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('authmsg').innerHTML='<p class="bad">'+esc(r.error.message)+'</p>'}async function signUp(){let r=await sb.auth.signUp({email:$('email').value,password:$('password').value});$('authmsg').innerHTML=r.error?'<p class="bad">'+esc(r.error.message)+'</p>':'<p class="good">Account created. Check your email if confirmation is required.</p>'}async function signOut(){await sb.auth.signOut()}async function load(){let p=await sb.from('projects').select('*').order('created_at',{ascending:false}),e=await sb.from('engineers').select('*').order('name'),d=await sb.from('documents').select('*').order('created_at',{ascending:false}),r=await sb.from('rams').select('*').order('created_at',{ascending:false});if(p.error||e.error||d.error||r.error){alert((p.error||e.error||d.error).message);return}projects=p.data||[];engineers=e.data||[];docs=d.data||[];rams=r.data||[];nav();render()}function render(){if(page==='dashboard')dash();if(page==='projects')projectPage();if(page==='engineers')engineerPage();if(page==='documents')docPage();if(page==='rams')ramsPage()}function dash(){$('main').innerHTML=`<h2>Dashboard</h2><div class="grid"><div class="card"><div class="muted">Active projects</div><div class="stat">${projects.filter(p=>p.status==='Active').length}</div></div><div class="card"><div class="muted">Engineers</div><div class="stat">${engineers.length}</div></div><div class="card"><div class="muted">Paperwork</div><div class="stat">${docs.length}</div></div><div class="card"><div class="muted">Expiring in 30 days</div><div class="stat">${docs.filter(d=>d.expiry_date&&days(d.expiry_date)<=30).length}</div></div></div><div class="actions"><button class="primary" onclick="projectForm()">+ Add project</button><button class="secondary" onclick="engineerForm()">+ Add engineer</button><button class="secondary" onclick="docForm()">+ Add paperwork</button></div>`}function projectPage(){$('main').innerHTML=`<div class="actions"><h2 style="margin-right:auto">Projects</h2><button class="primary" onclick="projectForm()">+ Add project</button></div><div class="grid">${projects.map(p=>{let en=(p.engineer_ids||[]).map(x=>engineers.find(e=>e.id===x)?.name).filter(Boolean).join(', ');return `<div class="card"><div><h3>${esc(p.name)} <span class="badge ${p.status==='Active'?'good':''}">${esc(p.status)}</span></h3><p class="muted">${esc(p.client||'')}<br>${esc(p.site||'')}</p><p><b>Engineers:</b> ${esc(en||'None')}<br><b>Paperwork:</b> ${docs.filter(d=>d.project_id===p.id).length}</p><div class="actions"><button onclick="projectForm('${p.id}')">Edit</button><button class="secondary" onclick="docForm(null,'${p.id}')">+ Paperwork</button><button class="danger" onclick="deleteProject('${p.id}')">Delete</button></div></div></div>`}).join('')||'<div class="card muted">No projects yet.</div>'}</div>`}function getQuals(e){if(Array.isArray(e.qualifications_data))return e.qualifications_data;let q=(e.qualifications||'').trim();return q?[{name:q,number:'',expiry:e.cert_expiry||''}]:[]}function qualRows(e){let qs=getQuals(e);if(!qs.length)qs=[{name:'',number:'',expiry:''}];return qs.map((q,i)=>`<div class="card" style="margin-top:8px"><div class="grid"><div><label>Qualification</label><input class="qname" value="${esc(q.name||'')}" placeholder="e.g. ECS, 18th Edition, IPAF"></div><div><label>Certificate / ID No.</label><input class="qnumber" value="${esc(q.number||'')}" placeholder="Optional"></div></div><label>Expiry date</label><input class="qexpiry" type="date" value="${q.expiry||''}"><div class="actions"><button type="button" class="secondary" onclick="this.closest('.card').remove()">Remove qualification</button></div></div>`).join('')}function getReports(e){let r=e.reporting_data;return Array.isArray(r)?r:[]}function getTools(e){let t=e.tools_data;return Array.isArray(t)?t:[]}function reportRows(e){let r=getReports(e);if(!r.length)r=[{type:'',date:'',status:'',notes:'',file_path:'',file_name:''}];return r.map(x=>`<div class="card reportRow" style="margin-top:8px"><div class="g erPage(){$('main').innerHTML=`<div class="actions"><h2 style="margin-right:auto">Engineers</h2><button class="primary" onclick="engineerForm()">+ Add engineer</button></div><div class="grid">${engineers.map(e=>{let qs=getQuals(e),ts=getTools(e),rs=getReports(e);let photo=e.id_card_path?`<span class="badge good">ID card uploaded</span>`:'';let overdue=ts.filter(t=>t.calibration_due&&days(t.calibration_due)<0).length;return `<div class="card"><h3>${esc(e.name)} <span class="badge ${e.status==='Active'?'good':''}">${esc(e.status)}</span> ${photo}</h3><p class="muted">${esc(e.phone||'')}<br>${esc(e.email||'')}</p><p><b>Qualifications:</b> ${qs.length?qs.map(q=>esc(q.name)).join(', '):'None'}</p><p><b>Reporting:</b> ${rs.length?rs.length+' record'+(rs.length===1?'':'s'):'None'}</p><p><b>Tools:</b> ${ts.length?ts.length+' tool'+(ts.length===1?'':'s'):'None'} ${overdue?`<span class="badge bad">${overdue} calibration${overdue===1?'':'s'} overdue</span>`:''}</p><div class="actions"><button onclick="engineerForm('${e.id}')">Edit</button>${e.id_card_path?`<button class="secondary" onclick="viewEngineerID('${e.id}')">View ID</button>`:''}<button class="danger" onclick="deleteEngineer('${e.id}')">Delete</button></div></div>`}).join('')||'<div class="card muted">No engineers yet.</div>'}</div>`}async function viewEngineerID(eid){let e=engineers.find(x=>x.id===eid);if(!e?.id_card_path)return alert('No ID photo/card uploaded');let r=await sb.storage.from('project-documents').createSignedUrl(e.id_card_path,300);if(r.error)return alert(r.error.message);let isImg=/\.(jpe?g|png|gif|webp|heic|heif)$/i.test(e.id_card_name||'');openModal('Engineer ID card',`${isImg?`<img src="${r.data.signedUrl}" style="max-width:100%;border-radius:12px">`:`<p><a class="primary" style="padding:10px;border-radius:9px;color:white;text-decoration:none" href="${r.data.signedUrl}" target="_blank">Open ID document</a></p>`}<p class="muted">${esc(e.id_card_name||'ID card')}</p>`)}function docPage(){$('main').innerHTML=`<div class="actions"><h2 style="margin-right:auto">Paperwork</h2><button class="primary" onclick="docForm()">+ Add paperwork</button></div><div class="card">${docs.map(d=>{let p=projects.find(x=>x.id===d.project_id),n=d.expiry_date?days(d.expiry_date):null;return `<div class="item"><div><b>${esc(d.name)}</b> <span class="badge">${esc(d.type)}</span> ${n!==null?`<span class="badge ${n<0?'bad':n<=30?'warn':'good'}">${n<0?'Expired':n+' days left'}</span>`:''}</div><div class="muted">${esc(p?.name||'Unassigned')} • v${esc(d.version||'1.0')} • ${esc(d.approval_status||'Draft')} • ${esc(d.file_name||'No attachment')}</div><div class="actions"><button class="primary" onclick="docForm('${d.id}')">Edit</button><button class="secondary" onclick="viewDoc('${d.id}')">Details</button><button class="danger" onclick="deleteDoc('${d.id}')">Delete</button></div></div>`}).join('')||'<div class="muted">No paperwork yet.</div>'}</div>`}function openModal(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function projectForm(pid){let p=projects.find(x=>x.id===pid)||{id:id(),name:'',reference:'',client:'',site:'',start_date:'',end_date:'',status:'Active',notes:'',engineer_ids:[]};openModal(pid?'Edit project':'Add project',`<label>Name *</label><input id="pn" value="${esc(p.name)}"><label>Reference</label><input id="pr" value="${esc(p.reference)}"><label>Client</label><input id="pc" value="${esc(p.client)}"><label>Site</label><input id="ps" value="${esc(p.site)}"><div class="grid"><div><label>Start</label><input id="pd1" type="date" value="${p.start_date||''}"></div><div><label>End</label><input id="pd2" type="date" value="${p.end_date||''}"></div></div><label>Status</label><select id="pst"><option>Active</option><option>Planned</option><option>On Hold</option><option>Complete</option></select><label>Assign engineers</label><select id="pei" multiple size="5">${engineers.map(e=>`<option valu function riskClass(n){n=Number(n)||0;return n>=17?'Very High':n>=10?'High':n>=5?'Medium':n>=1?'Low':'—'}
function riskEditor(v){return `<div class="card riskRow" style="margin-top:8px"><label>Hazard</label><input class="rh" value="${esc(v.hazard||'')}"><label>Who could be harmed?</label><input class="rw" value="${esc(v.who||'')}"><div class="grid"><div><label>Initial likelihood (1-5)</label><input class="rl" type="number" min="1" max="5" value="${v.likelihood||''}" oninput="updateRiskScore(this.closest('.riskRow'))"></div><div><label>Initial severity (1-5)</label><input class="rs" type="number" min="1" max="5" value="${v.severity||''}" oninput="updateRiskScore(this.closest('.riskRow'))"></div></div><div class="riskScore"><b>Initial risk:</b> <span class="initialScore">—</span></div><label>Control measures</label><textarea class="rc">${esc(v.controls||'')}</textarea><div class="grid"><div><label>Residual likelihood (1-5)</label><input class="rrl" type="number" min="1" max="5" value="${v.res_likelihood||''}" oninput="updateRiskScore(this.closest('.riskRow'))"></div><div><label>Residual severity (1-5)</label><input class="rrs" type="number" min="1" max="5" value="${v.res_severity||''}" oninput="updateRiskScore(this.closest('.riskRow'))"></div></div><div class="riskScore"><b>Residual risk:</b> <span class="residualScore">—</span></div><button type="button" class="secondary" onclick="this.closest('.riskRow').remove()">Remove hazard</button></div>`}
function riskRows(x){let a=Array.isArray(x.risks)?x.risks:[];if(!a.length)a=[{hazard:'',who:'',likelihood:'',severity:'',controls:'',res_likelihood:'',res_severity:''}];return a.map(riskEditor).join('')}
function updateRiskScore(row){if(!row)return;let il=(Number(row.querySelector('.rl')?.value)||0)*(Number(row.querySelector('.rs')?.value)||0),rl=(Number(row.querySelector('.rrl')?.value)||0)*(Number(row.querySelector('.rrs')?.value)||0);let a=row.querySelector('.initialScore'),b=row.querySelector('.residualScore');if(a)a.textContent=il?`${il} (${riskClass(il)})`:'—';if(b)b.textContent=rl?`${rl} (${riskClass(rl)})`:'—'}
function addSolarHazards(){let list=$('riskList');solarHazards.forEach(v=>list.insertAdjacentHTML('beforeend',riskEditor(v)));[...list.querySelectorAll('.riskRow')].forEach(updateRiskScore)}
