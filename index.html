<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Project Control</title><style>body{font-family:system-ui;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:16px;position:sticky;top:0}main{max-width:1000px;margin:auto;padding:16px}.nav{display:flex;gap:6px;overflow:auto;background:#fff;padding:10px;position:sticky;top:64px}.nav button,.actions button{padding:10px;border:0;border-radius:9px;font-weight:700}.nav .active{background:#2563eb;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px}.stat{font-size:30px;font-weight:800}.muted{color:#6b7280}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:9px;font:inherit}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}.item.docItem{cursor:pointer}.item.docItem:hover{background:#f9fafb}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.primary{background:#2563eb;color:#fff}.danger{background:#dc2626;color:#fff}.secondary{background:#e5e7eb}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center}.modal.hidden{display:none}.modalbox{background:white;width:100%;max-width:720px;max-height:94vh;overflow:auto;padding:18px;border-radius:18px 18px 0 0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#e5e7eb}.good{background:#d1fae5;color:#065f46}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.item{border-top:1px solid #e5e7eb;padding:12px 0}@media(min-width:700px){.modal{align-items:center}.modalbox{border-radius:18px}}</style></head><body><div id="login" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div class="card" style="max-width:420px;width:100%"><h1>Project Control</h1><p class="muted">Sign in to your cloud project system.</p><div id="authmsg"></div><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><div class="actions"><button class="primary" onclick="signIn()">Sign in</button><button class="secondary" onclick="signUp()">Create account</button></div></div></div><div id="appShell" style="display:none"><header><div style="display:flex;justify-content:space-between;align-items:center"><div><strong style="font-size:21px">Project Control</strong><br><small>Projects • Engineers • Paperwork</small></div><button class="secondary" onclick="signOut()">Sign out</button></div></header><div class="nav" id="nav"></div><main id="main"></main></div><div id="modal" class="modal hidden"><div class="modalbox"><div style="display:flex;justify-content:space-between"><h2 id="mt"></h2><button class="secondary" onclick="closeModal()">Close</button></div><div id="mb"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://lympnshxwirqvsnorfqb.supabase.co','sb_publishable_AlEDTKVhif5C89X-bLc3qQ_Bd4hDYaS');let page='dashboard',projects=[],engineers=[],docs=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const id=()=>crypto.randomUUID();function nav(){let n=[['dashboard','Dashboard'],['projects','Projects'],['engineers','Engineers'],['documents','Paperwork']];$('nav').innerHTML=n.map(x=>`<button class="${page==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}async function go(p){page=p;nav();render()}async function signIn(){let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('authmsg').innerHTML='<p class="bad">'+esc(r.error.message)+'</p>'}async function signUp(){let r=await sb.auth.signUp({email:$('email').value,password:$('password').value});$('authmsg').innerHTML=r.error?'<p class="bad">'+esc(r.error.message)+'</p>':'<p class="good">Account created. Check your email if confirmation is required.</p>'}async function signOut(){await sb.auth.signOut()}async function load(){let p=await sb.from('projects').select('*').order('created_at',{ascending:false}),e=await sb.from('engineers').select('*').order('name'),d=await sb.from('documents').select('*').order('created_at',{ascending:false});if(p.error||e.error||d.error){alert((p.error||e.error||d.error).message);return}projects=p.data||[];engineers=e.data||[];docs=d.data||[];nav();render()}function render(){if(page==='dashboard')dash();if(page==='projects')projectPage();if(page==='engineers')engineerPage();if(page==='documents')docPage()}function dash(){$('main').innerHTML=`<h2>Dashboard</h2><div class="grid"><div class="card"><div class="muted">Active projects</div><div class="stat">${projects.filter(p=>p.status==='Active').length}</div></div><div class="card"><div class="muted">Engineers</div><div class="stat">${engineers.length}</div></div><div class="card"><div class="muted">Paperwork</div><div class="stat">${docs.length}</div></div><div class="card"><div class="muted">Expiring in 30 days</div><div class="stat">${docs.filter(d=>d.expiry_date&&days(d.expiry_date)<=30).length}</div></div></div><div class="actions"><button class="primary" onclick="projectForm()">+ Add project</button><button class="secondary" onclick="engineerForm()">+ Add engineer</button><button class="secondary" onclick="docForm()">+ Add paperwork</button></div>`}function projectPage(){$('main').innerHTML=`<div class="actions"><h2 style="margin-right:auto">Projects</h2><button class="primary" onclick="projectForm()">+ Add project</button></div><div class="grid">${projects.map(p=>{let en=(p.engineer_ids||[]).map(x=>engineers.find(e=>e.id===x)?.name).filter(Boolean).join(', ');return `<div class="card"><div><h3>${esc(p.name)} <span class="badge ${p.status==='Active'?'good':''}">${esc(p.status)}</span></h3><p class="muted">${esc(p.client||'')}<br>${esc(p.site||'')}</p><p><b>Engineers:</b> ${esc(en||'None')}<br><b>Paperwork:</b> ${docs.filter(d=>d.project_id===p.id).length}</p><div class="actions"><button onclick="projectForm('${p.id}')">Edit</button><button class="secondary" onclick="docForm(null,'${p.id}')">+ Paperwork</button><button class="danger" onclick="deleteProject('${p.id}')">Delete</button></div></div></div>`}).join('')||'<div class="card muted">No projects yet.</div>'}</div>`}function getQuals(e){if(Array.isArray(e.qualifications_data))return e.qualifications_data;let q=(e.qualifications||'').trim();return q?[{name:q,number:'',expiry:e.cert_expiry||''}]:[]}function qualRows(e){let qs=getQuals(e);if(!qs.length)qs=[{name:'',number:'',expiry:''}];return qs.map((q,i)=>`<div class="card" style="margin-top:8px"><div class="grid"><div><label>Qualification</label><input class="qname" value="${esc(q.name||'')}" placeholder="e.g. ECS, 18th Edition, IPAF"></div><div><label>Certificate / ID No.</label><input class="qnumber" value="${esc(q.number||'')}" placeholder="Optional"></div></div><label>Expiry date</label><input class="qexpiry" type="date" value="${q.expiry||''}"><div class="actions"><button type="button" class="secondary" onclick="this.closest('.card').remove()">Remove qualification</button></div></div>`).join('')}function getReports(e){let r=e.reporting_data;return Array.isArray(r)?r:[]}function getTools(e){let t=e.tools_data;return Array.isArray(t)?t:[]}function reportRows(e){let r=getReports(e);if(!r.length)r=[{type:'',date:'',status:'',notes:'',file_path:'',file_name:''}];return r.map(x=>`<div class="card reportRow" style="margin-top:8px"><div class="grid"><div><label>Report / type</label><input class="rname" value="${esc(x.type||'')}" placeholder="e.g. Daily report, job sheet, site report"></div><div><label>Date</label><input class="rdate" type="date" value="${x.date||''}"></div></div><label>Status</label><select class="rstatus"><option value="Completed">Completed</option><option value="Due">Due</option><option value="Outstanding">Outstanding</option><option value="Not required">Not required</option></select><label>Notes</label><input class="rnotes" value="${esc(x.notes||'')}" placeholder="Optional"><label>Report document</label><input class="rfile" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"><p class="muted">${x.file_name?`Current file: ${esc(x.file_name)}`:'No report document uploaded'}</p><input type="hidden" class="rpath" value="${esc(x.file_path||'')}"><input type="hidden" class="rfilename" value="${esc(x.file_name||'')}"><div class="actions"><button type="button" class="secondary" onclick="let p=this.closest('.reportRow').querySelector('.rpath').value,n=this.closest('.reportRow').querySelector('.rfile').files[0]?.name||'Report document';viewEngineerFile(p,n,'Report document')">View document</button><button type="button" class="secondary" onclick="this.closest('.reportRow').remove()">Remove report</button></div></div>`).join('')}function toolRows(e){let t=getTools(e);if(!t.length)t=[{name:'',make:'',serial:'',calibration_date:'',calibration_due:'',condition:'',notes:'',calibration_file_path:'',calibration_file_name:''}];return t.map(x=>`<div class="card toolRow" style="margin-top:8px"><div class="grid"><div><label>Tool</label><input class="tname" value="${esc(x.name||'')}" placeholder="e.g. Fluke multifunction tester"></div><div><label>Make / Model</label><input class="tmake" value="${esc(x.make||'')}" placeholder="Optional"></div></div><div class="grid"><div><label>Serial number</label><input class="tserial" value="${esc(x.serial||'')}"></div><div><label>Calibration date</label><input class="tcal" type="date" value="${x.calibration_date||''}"></div></div><div class="grid"><div><label>Calibration due</label><input class="tdue" type="date" valu /button></div><div class="grid">${engineers.map(e=>{let qs=getQuals(e),ts=getTools(e),rs=getReports(e);let photo=e.id_card_path?`<span class="badge good">ID card uploaded</span>`:'';let overdue=ts.filter(t=>t.calibration_due&&days(t.calibration_due)<0).length;return `<div class="card"><h3>${esc(e.name)} <span class="badge ${e.status==='Active'?'good':''}">${esc(e.status)}</span> ${photo}</h3><p class="muted">${esc(e.phone||'')}<br>${esc(e.email||'')}</p><p><b>Qualifications:</b> ${qs.length?qs.map(q=>esc(q.name)).join(', '):'None'}</p><p><b>Reporting:</b> ${rs.length?rs.length+' record'+(rs.length===1?'':'s'):'None'}</p><p><b>Tools:</b> ${ts.length?ts.length+' tool'+(ts.length===1?'':'s'):'None'} ${overdue?`<span class="badge bad">${overdue} calibration${overdue===1?'':'s'} overdue</span>`:''}</p><div class="actions"><button onclick="engineerForm('${e.id}')">Edit</button>${e.id_card_path?`<button class="secondary" onclick="viewEngineerID('${e.id}')">View ID</button>`:''}<button class="danger" onclick="deleteEngineer('${e.id}')">Delete</button></div></div>`}).join('')||'<div class="card muted">No engineers yet.</div>'}</div>`}async function viewEngineerID(eid){let e=engineers.find(x=>x.id===eid);if(!e?.id_card_path)return alert('No ID photo/card uploaded');let r=await sb.storage.from('project-documents').createSignedUrl(e.id_card_path,300);if(r.error)return alert(r.error.message);let isImg=/\.(jpe?g|png|gif|webp|heic|heif)$/i.test(e.id_card_name||'');openModal('Engineer ID card',`${isImg?`<img src="${r.data.signedUrl}" style="max-width:100%;border-radius:12px">`:`<p><a class="primary" style="padding:10px;border-radius:9px;color:white;text-decoration:none" href="${r.data.signedUrl}" target="_blank">Open ID document</a></p>`}<p class="muted">${esc(e.id_card_name||'ID card')}</p>`)}function docPage(){$('main').innerHTML=`<div class="actions"><h2 style="margin-right:auto">Paperwork</h2><button class="primary" onclick="docForm()">+ Add paperwork</button></div><div class="card">${docs.map(d=>{let p=projects.find(x=>x.id===d.project_id),n=d.expiry_date?days(d.expiry_date):null;return `<div class="item"><div><b>${esc(d.name)}</b> <span class="badge">${esc(d.type)}</span> ${n!==null?`<span class="badge ${n<0?'bad':n<=30?'warn':'good'}">${n<0?'Expired':n+' days left'}</span>`:''}</div><div class="muted">${esc(p?.name||'Unassigned')} • v${esc(d.version||'1.0')} • ${esc(d.approval_status||'Draft')} • ${esc(d.file_name||'No attachment')}</div><div class="actions"><button class="primary" onclick="docForm('${d.id}')">Edit</button><button class="secondary" onclick="viewDoc('${d.id}')">Details</button><button class="danger" onclick="deleteDoc('${d.id}')">Delete</button></div></div>`}).join('')||'<div class="muted">No paperwork yet.</div>'}</div>`}function openModal(t,b){$('mt').textContent=t;$('mb').innerHTML=b;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function projectForm(pid){let p=projects.find(x=>x.id===pid)||{id:id(),name:'',reference:'',client:'',site:'',start_date:'',end_date:'',status:'Active',notes:'',engineer_ids:[]};openModal(pid?'Edit project':'Add project',`<label>Name *</label><input id="pn" value="${esc(p.name)}"><label>Reference</label><input id="pr" value="${esc(p.reference)}"><label>Client</label><input id="pc" value="${esc(p.client)}"><label>Site</label><input id="ps" value="${esc(p.site)}"><div class="grid"><div><label>Start</label><input id="pd1" type="date" value="${p.start_date||''}"></div><div><label>End</label><input id="pd2" type="date" value="${p.end_date||''}"></div></div><label>Status</label><select id="pst"><option>Active</option><option>Planned</option><option>On Hold</option><option>Complete</option></select><label>Assign engineers</label><select id="pei" multiple size="5">${engineers.map(e=>`<option value="${e.id}" ${(p.engineer_ids||[]).includes(e.id)?'selected':''}>${esc(e.name)}</option>`).join('')}</select><label>Notes</label><textarea id="pno">${esc(p.notes)}</textarea><div class="actions"><button class="primary" onclick="saveProject('${p.id}')">Save</button></div>`);$('pst').value=p.status}async function saveProject(pid){let x={id:pid,name:$('pn').value.trim(),reference:$('pr').value,client:$('pc').value,site:$('ps').value,start_date:$('pd1').value||null,end_date:$('pd2').value||null,status:$('pst').value,notes:$('pno').value,engineer_ids:[...$('pei').selectedOptions].map(o=>o.value)};if(!x.name)return alert('Project name is required');let r=await sb.from('projects').upsert(x);if(r.error)return alert(r.error.message);closeModal();load()}async function deleteProject(x){if(confirm('Delete project and linked paperwork?')){let r=await sb.from('projects').delete().eq('id',x);if(r.error)alert(r.error.message);else load()}}function engineerForm(eid){let e=engineers.find(x=>x.id===eid)||{id:id(),name:'',phone:'',email:'',qualifications:'',cert_expiry:'',status:'Active',qualifications_data:[],reporting_data:[],tools_data:[],id_card_path:'',id_card_name:''};let qs=getQuals(e);openModal(eid?'Edit engineer':'Add engineer',`<label>Name *</label><input id="en" value="${esc(e.name)}"><label>Phone</label><input id="ep" value="${esc(e.phone)}"><label>Email</label><input id="ee" value="${esc(e.email)}"><h3 style="margin-top:18px">Qualifications</h3><div id="qualificationsList">${qualRows(e)}</div><div class="actions"><button type="button" class="secondary" onclick="addQualificationRow()">+ Add qualification</button></div><h3 style="margin-top:18px">Reporting</h3><p class="muted">Track reports, job sheets or other reporting completed by the engineer.</p><div id="reportingList">${reportRows(e)}</div><div class="actions"><button type="button" class="secondary" onclick="addReportRow()">+ Add report</button></div><h3 style="margin-top:18px">Tool tracking</h3><p class="muted">Record tools issued to the engineer, serial numbers and calibration dates.</p><div id="toolsList">${toolRows(e)}</div><div class="actions"><button type="button" clas ass="secondary" onclick="this.closest('.reportRow').remove()">Remove report</button></div></div>`)}function addToolRow(){$('toolsList').insertAdjacentHTML('beforeend',`<div class="card toolRow" style="margin-top:8px"><div class="grid"><div><label>Tool</label><input class="tname" placeholder="e.g. Fluke multifunction tester"></div><div><label>Make / Model</label><input class="tmake" placeholder="Optional"></div></div><div class="grid"><div><label>Serial number</label><input class="tserial"></div><div><label>Calibration date</label><input class="tcal" type="date"></div></div><div class="grid"><div><label>Calibration due</label><input class="tdue" type="date"></div><div><label>Condition</label><select class="tcondition"><option>Good</option><option>Service required</option><option>Damaged</option><option>Out of service</option></select></div></div><label>Notes</label><input class="tnotes" placeholder="Optional"><div class="actions"><button type="button" class="secondary" onclick="let p=this.closest('.toolRow').querySelector('.tcpath').value,n=this.closest('.toolRow').querySelector('.tcert').files[0]?.name||'Calibration certificate';viewEngineerFile(p,n,'Calibration certificate')">View certificate</button><button type="button" class="secondary" onclick="this.closest('.toolRow').remove()">Remove tool</button></div></div>`)}async function saveEngineer(eid){let existing=engineers.find(a=>a.id===eid)||{};let rs=[...document.querySelectorAll('#reportingList .reportRow')].map(c=>({type:c.querySelector('.rname')?.value.trim()||'',date:c.querySelector('.rdate')?.value||'',status:c.querySelector('.rstatus')?.value||'',notes:c.querySelector('.rnotes')?.value.trim()||'',file_path:c.querySelector('.rpath')?.value||'',file_name:c.querySelector('.rpath')?.value?(c.querySelector('.rfile')?.files[0]?.name||''):''})).filter(r=>r.type||r.date||r.status||r.notes||r.file_path);let ts=[...document.querySelectorAll('#toolsList .toolRow')].map(c=>({name:c.querySelector('.tname')?.value.trim()
